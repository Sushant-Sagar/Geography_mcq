    <script>
        const questionsData = [
            // 1 to 30
            { q: "1. ज्योग्राफी शब्द का प्रयोग सर्वप्रथम किसने किया था?", opts: ["हिकेटियस", "हम्बोल्ट", "इरैटोस्थनीज", "कॉपर निकस"], ans: "इरैटोस्थनीज", exp: "इरैटोस्थनीज एक यूनानी विद्वान थे जिन्होंने सबसे पहले 'ज्योग्राफी' शब्द का प्रयोग किया था। इन्हें व्यवस्थित भूगोल का जनक भी कहा जाता है।" },
            { q: "2. विश्व के मानचित्र पर सर्वप्रथम किसने भारत को दर्शाया था?", opts: ["मार्टिन बैहम", "टॉलमी", "कॉपरनिकस", "एनविले"], ans: "टॉलमी", exp: "क्लॉडियस टॉलमी ने दूसरी शताब्दी में विश्व के मानचित्र पर भारत को दर्शाने का प्रथम प्रयास किया था। उन्होंने 'ज्योग्राफिया' नामक पुस्तक भी लिखी।" },
            { q: "3. पृथ्वी पर स्थित सबसे छोटा महासागर कौन-सा है?", opts: ["प्रशांत महासागर", "अटलांटिक महासागर", "हिंद महासागर", "आर्कटिक महासागर"], ans: "आर्कटिक महासागर", exp: "आर्कटिक महासागर पृथ्वी का सबसे छोटा और सबसे उथला महासागर है। यह मुख्य रूप से उत्तरी ध्रुवीय क्षेत्र में स्थित है।" },
            { q: "4. पृथ्वी के 23½° और 66½° अक्षांशों के बीच कौन सा कटिबंध का विस्तार है?", opts: ["उष्ण कटिबंध", "शीतोष्ण कटिबंध", "शीत कटिबंध", "ध्रुवीय प्रदेश"], ans: "शीतोष्ण कटिबंध", exp: "कर्क रेखा (23½°N) से आर्कटिक वृत्त (66½°N) और मकर रेखा से अंटार्कटिक वृत्त के बीच के क्षेत्र को शीतोष्ण (Temperate) कटिबंध कहते हैं।" },
            { q: "5. पृथ्वी के केन्द्र से विषुवत रेखा को आधार मानकर मापी गई दूरी को क्या कहते हैं?", opts: ["देशांतर एवं देशांतर रेखा", "अक्षांश एवं अक्षांश रेखा", "देशांतरीय विस्तार", "अक्षांशीय विस्तार"], ans: "अक्षांश एवं अक्षांश रेखा", exp: "विषुवत रेखा (Equator) को आधार मानकर पृथ्वी के केंद्र से मापी गई कोणीय दूरी को अक्षांश कहा जाता है।" },
            { q: "6. हमारा देश भारत का सबसे पूर्वी बिन्दु कौन सा है?", opts: ["केप कमोरिन", "किबीथु", "गुहार मोती", "इंदिरा प्वॉइंट"], ans: "किबीथु", exp: "भारत का सबसे पूर्वी बिंदु अरुणाचल प्रदेश के अंजॉ जिले में स्थित 'किबीथु' (Kibithu) है।" },
            { q: "7. कर्क रेखा निम्नलिखित में से किन-किन राज्यों से नहीं गुजरती है?", opts: ["गुजरात एवं राजस्थान", "छत्तीसगढ़ एवं झारखंड", "पश्चिम बंगाल एवं असम", "मिजोरम एवं त्रिपुरा"], ans: "पश्चिम बंगाल एवं असम", exp: "कर्क रेखा भारत के 8 राज्यों से गुजरती है। यह असम से होकर नहीं गुजरती है, इसलिए यह विकल्प सही है।" },
            { q: "8. भारतीय मानक समय कितने पूर्वी देशांतर पर स्थित है?", opts: ["83½°", "82½°", "84½°", "0°"], ans: "82½°", exp: "भारत का मानक समय (IST) 82.5° (82½°) पूर्वी देशांतर से लिया गया है, जो प्रयागराज (नैनी) के पास से गुजरता है।" },
            { q: "9. भारत के मुख्य भूमि के समुद्री सीमा की लंबाई कितना किलोमीटर है?", opts: ["6100 km", "7516 km", "22,716 km", "15,200 km"], ans: "6100 km", exp: "भारत की मुख्य भूमि की तटीय लंबाई लगभग 6100 किमी है। द्वीपों सहित यह 7516.6 किमी हो जाती है।" },
            { q: "10. भारत के प्रादेशिक जल सीमा की लंबाई आधार रेखा से कितना दूर तक है?", opts: ["12 नॉटिकल मील", "24 नॉटिकल मील", "200 नॉटिकल मील", "1.852 किलोमीटर"], ans: "12 नॉटिकल मील", exp: "आधार रेखा (Baseline) से समुद्र की ओर 12 समुद्री मील (Nautical Miles) तक के क्षेत्र को प्रादेशिक जल सीमा कहा जाता है।" },
            { q: "11. पश्चिमी तट पर स्थित कन्याकुमारी से कृष्णा नदी डेल्टा तक को क्या कहा जाता है?", opts: ["मालाबार तट", "कोरोमंडल तट", "उत्कल तट", "कोंकण तट"], ans: "कोरोमंडल तट", exp: "कृष्णा डेल्टा से लेकर दक्षिण में कन्याकुमारी तक के पूर्वी तट (पश्चिमी नहीं, यद्यपि प्रश्न में टाइपो हो सकता है) को कोरोमंडल तट कहा जाता है।" },
            { q: "12. अंडमान और निकोबार को कौन सा चैनल अलग करता है?", opts: ["8°", "10°", "9°", "11°"], ans: "10°", exp: "10 डिग्री चैनल अंडमान द्वीप समूह को निकोबार द्वीप समूह से अलग करता है। यह बंगाल की खाड़ी में स्थित है।" },
            { q: "13. भारत से सबसे छोटा सीमा (स्थलीय) किस देश का लगता है?", opts: ["नेपाल", "बांग्लादेश", "अफगानिस्तान", "चीन"], ans: "अफगानिस्तान", exp: "भारत की सबसे छोटी स्थलीय सीमा अफगानिस्तान (लगभग 106 किमी, POK क्षेत्र में) के साथ लगती है।" },
            { q: "14. भारत के भौतिक भू-भाग के कितने प्रतिशत क्षेत्र पर पठारी क्षेत्र का विस्तार है?", opts: ["43.0%", "27.7%", "18.6%", "10.7%"], ans: "27.7%", exp: "भारत के कुल क्षेत्रफल का लगभग 43% मैदान, 27.7% पठार, 18.6% पहाड़ियाँ और 10.7% पर्वत हैं।" },
            { q: "15. भारत का राष्ट्रीय विरासत पशु कौन सा है?", opts: ["मोर", "हाथी", "बाघ", "डॉल्फिन"], ans: "हाथी", exp: "भारत सरकार ने 2010 में हाथियों के संरक्षण को बढ़ावा देने के लिए हाथी (Elephant) को राष्ट्रीय विरासत पशु घोषित किया था।" },
            { q: "16. कार्बोनीफेरस युग में पृथ्वी के सभी स्थलखंड आपस में जुड़े थे जिसे अल्फ्रेड वेगनर ने क्या कहा?", opts: ["पैंथालासा", "अंगारालैंड", "गोंडवानालैंड", "पेंजिया"], ans: "पेंजिया", exp: "अल्फ्रेड वेगनर के महाद्वीपीय विस्थापन सिद्धांत के अनुसार, सभी महाद्वीप एक विशाल भूखंड का हिस्सा थे जिसे 'पेंजिया' (Pangaea) कहा गया।" },
            { q: "17. पृथ्वी निर्माण के क्रम में प्री कैंब्रियन महाकल्प में सर्वप्रथम किस पहाड़ का निर्माण हुआ?", opts: ["आर्कियन चट्टान", "धारवाड़ चट्टान", "कुड़प्पा चट्टान", "विंध्यन चट्टान"], ans: "आर्कियन चट्टान", exp: "आर्कियन चट्टानें पृथ्वी की सबसे प्राचीन चट्टानें हैं जिनका निर्माण तप्त पृथ्वी के ठंडे होने पर सबसे पहले हुआ था।" },
            { q: "18. किस क्रम के चट्टान में कोयला का निर्माण महत्वपूर्ण रूप से हुआ है?", opts: ["धारवाड़ क्रम", "आर्कियन क्रम", "विंध्यन क्रम", "गोंडवाना क्रम"], ans: "गोंडवाना क्रम", exp: "भारत में 98% से अधिक कोयला भंडार गोंडवाना क्रम की चट्टानों में पाया जाता है, जो दामोदर, महानदी आदि घाटियों में है।" },
            { q: "19. हिमालय की उत्पत्ति से संबंधित 'प्लेट विवर्तनिकी' का सिद्धांत किसने प्रस्तुत किया?", opts: ["अल्फ्रेड वेगनर", "मोर्गन और आइजैक", "कोबर", "एंटोनियो मोनसेरेट"], ans: "मोर्गन और आइजैक", exp: "प्लेट विवर्तनिकी (Plate Tectonics) का सिद्धांत 1967 में मैकेंजी, पार्कर, और मॉर्गन जैसे भूवैज्ञानिकों द्वारा प्रस्तुत किया गया था।" },
            { q: "20. उत्तर भारत के विशाल मैदानी भाग का निर्माण किस काल में हुआ?", opts: ["तृतीयक कल्प", "चतुर्थ काल", "मेसोजोइक महाकल्प", "पैलियोजोइक महाकल्प"], ans: "चतुर्थ काल", exp: "उत्तर भारत के विशाल मैदान का निर्माण नदियों द्वारा लाए गए जलोढ़ निक्षेपों से चतुर्थ काल (Quaternary Period) में हुआ है।" },
            { q: "21. ट्रांस हिमालय में स्थित कौन सी पर्वत श्रेणियाँ स्थित नहीं हैं?", opts: ["काराकोरम", "गॉडविन ऑस्टिन", "जास्कर श्रेणी", "अन्नपूर्णा"], ans: "अन्नपूर्णा", exp: "काराकोरम, लद्दाख और जास्कर ट्रांस हिमालय का हिस्सा हैं। अन्नपूर्णा श्रेणी महान हिमालय (नेपाल) में स्थित है।" },
            { q: "22. महान हिमालय में, भारत में स्थित सबसे ऊँची चोटी है-", opts: ["नंगा पर्वत", "कंचनजंगा", "माउंट एवरेस्ट", "नामचा बरवा"], ans: "कंचनजंगा", exp: "कंचनजंगा (8,586 मीटर) महान हिमालय में भारत की सबसे ऊँची चोटी है (सिक्किम में स्थित)। K2 काराकोरम श्रेणी में है।" },
            { q: "23. वृहद व लघु हिमालय के बीच कई घाटियाँ स्थित हैं। जिसमें हिमाचल प्रदेश में कौन-कौन अवस्थित है-", opts: ["गुलमर्ग व सोनमर्ग", "कांगड़ा, लाहूल व स्पीति", "गलवान घाटी, नुब्रा घाटी", "चुंबी घाटी, युथांग घाटी"], ans: "कांगड़ा, लाहूल व स्पीति", exp: "कांगड़ा, कुल्लू, लाहौल और स्पीति घाटियाँ हिमाचल प्रदेश में हैं। गुलमर्ग कश्मीर में और चुंबी घाटी सिक्किम के पास है।" },
            { q: "24. पूर्वांचल हिमालय की कौन सी पहाड़ियाँ अरुणाचल प्रदेश में स्थित हैं?", opts: ["गारो, खासी व जयंतिया", "डफला, मीरी, अबोर, पटकाई बूम", "लैमातोल पहाड़ी", "मिकिर, रेंगमा, भुवन"], ans: "डफला, मीरी, अबोर, पटकाई बूम", exp: "डफला, मीरी, अबोर, मिश्मी और पटकाई बूम अरुणाचल प्रदेश में स्थित महत्वपूर्ण पहाड़ियाँ हैं।" },
            { q: "25. सिडनी बुर्रार्ड के द्वारा विभाजित हिमालय का कौन सा भाग सतलज और काली नदी के बीच का क्षेत्र है?", opts: ["असम हिमालय", "नेपाल हिमालय", "कुमाऊँ हिमालय", "पंजाब हिमालय"], ans: "कुमाऊँ हिमालय", exp: "सतलज और काली नदियों के बीच स्थित हिमालय को कुमाऊँ हिमालय कहा जाता है। इसका विस्तार मुख्य रूप से उत्तराखंड में है।" },
            { q: "26. अरुणाचल प्रदेश का प्रमुख दर्रे निम्नलिखित में से कौन-कौन हैं?", opts: ["माना, नीति, लिपुलेख", "बनिहाल, रोहतांग, शिपकीला", "दिफू, बोमडिला, यांग्याप, पांगसाऊ", "पालघाट, थालघाट, भोरघाट"], ans: "दिफू, बोमडिला, यांग्याप, पांगसाऊ", exp: "बोमडिला, यांग्याप, दिफू और पांगसाऊ दर्रे अरुणाचल प्रदेश को तिब्बत और म्यांमार से जोड़ते हैं।" },
            { q: "27. पंजाब के मैदान में स्थित रावी और व्यास के दोआब को क्या कहा जाता है?", opts: ["बारी दोआब", "बिस्ट दोआब", "चाज दोआब", "सिंधु सागर दोआब"], ans: "बारी दोआब", exp: "ब्यास और रावी नदियों के बीच के उपजाऊ क्षेत्र को 'बारी' दोआब (Ba-Ri) कहा जाता है।" },
            { q: "28. राजस्थान के मैदान में स्थित प्रमुख स्थलाकृति को क्या कहा जाता है?", opts: ["टोर", "बालूका स्तूप", "रोही", "खादर व चौर"], ans: "रोही", exp: "अरावली पर्वत के पश्चिम में स्थित उपजाऊ मैदानी क्षेत्र को स्थानीय भाषा में 'रोही' कहा जाता है।" },
            { q: "29. पश्चिमी घाट में कर्नाटक में स्थित प्रमुख पहाड़ी है-", opts: ["अन्नामलाई", "नीलगिरी", "बाबूदान (बाबा बुदन)", "कालसुबाई"], ans: "बाबूदान (बाबा बुदन)", exp: "बाबा बुदन की पहाड़ियाँ कर्नाटक के पश्चिमी घाट में स्थित हैं, जो लौह अयस्क और कॉफी बागानों के लिए प्रसिद्ध हैं।" },
            { q: "30. झारखंड में मुख्यतः किस पठार का विस्तार है?", opts: ["दक्कन का पठार", "मालवा का पठार", "बुन्देलखण्ड का पठार", "छोटानागपुर का पठार"], ans: "छोटानागपुर का पठार", exp: "छोटानागपुर पठार का अधिकांश हिस्सा झारखंड में है। यह खनिजों (कोयला, लोहा आदि) में अत्यधिक समृद्ध है।" },
            
            // 31 to 100
            { q: "31. प्री-कैंब्रियन काल में उत्पन्न भारत का सबसे प्राचीनतम 'अपशिष्ट पर्वत' कौन हैं?", opts: ["सतपुड़ा पर्वत", "विंध्याचल पर्वत", "बुन्देलखण्ड का पठार", "अरावली पर्वत"], ans: "अरावली पर्वत", exp: "अरावली भारत ही नहीं विश्व के सबसे प्राचीन वलित पर्वतों में से एक है, जो अब अपरदन के कारण अपशिष्ट (अवशिष्ट) पर्वत का रूप ले चुका है। इसका विस्तार गुजरात से दिल्ली तक है।" },
            { q: "32. भारत के उत्तर पूर्वी पठारी क्षेत्र का प्रमुख पठार है-", opts: ["कलेसर पर्वत", "बेतला पर्वत", "कार्बी ऐंगलोंग पठार", "मोल्लेम"], ans: "कार्बी ऐंगलोंग पठार", exp: "असम में स्थित कार्बी ऐंगलोंग का पठार और मेघालय का पठार मुख्य रूप से भारत के प्रायद्वीपीय पठार का ही उत्तर-पूर्वी विस्तार माने जाते हैं।" },
            { q: "33. भारत के पश्चिमी तटीय मैदान जो गोवा से मंगलुरू के बीच स्थित है, उसे कहा जाता है-", opts: ["गुजरात तटीय मैदान", "कोंकण तटीय मैदान", "कन्नड तटीय मैदान", "मालाबार तटीय मैदान"], ans: "कन्नड तटीय मैदान", exp: "गोवा से कर्नाटक के मंगलुरु तक के पश्चिमी तटीय मैदान को कन्नड़ (केनरा) तट कहा जाता है, जबकि मंगलुरु से कन्याकुमारी तक मालाबार तट है।" },
            { q: "34. पूर्वी भाग में महानदी और कृष्णा के बीच कौन सा तटीय मैदान अवस्थित है?", opts: ["उत्कल", "उत्तरी सरकार", "कोरोमंडल", "इनमें से कोई नहीं"], ans: "उत्तरी सरकार", exp: "भारत के पूर्वी तट पर महानदी (ओडिशा) और कृष्णा नदी (आंध्र प्रदेश) के डेल्टा के बीच के क्षेत्र को उत्तरी सरकार तट कहा जाता है।" },
            { q: "35. उत्तरी अंडमान में स्थित एक प्रमुख द्वीप है-", opts: ["बैरन द्वीप", "नारकोंडम द्वीप", "कोको द्वीप व प्रिपेरिस द्वीप", "लैंडफॉल द्वीप"], ans: "लैंडफॉल द्वीप", exp: "लैंडफॉल द्वीप (Landfall Island) अंडमान द्वीप समूह का सबसे उत्तरी द्वीप है। यह म्यांमार के कोको द्वीप के ठीक दक्षिण में स्थित है।" },
            { q: "36. हाल ही में (2018) किस द्वीप का नया नाम सुभाष चन्द्र बोस रखा गया है?", opts: ["शहीद द्वीप", "रॉस द्वीप", "स्वराज द्वीप", "श्रीविजयपुरम"], ans: "रॉस द्वीप", exp: "30 दिसंबर 2018 को अंडमान-निकोबार के 'रॉस द्वीप' का नाम बदलकर नेताजी सुभाष चंद्र बोस द्वीप, हैवलॉक का स्वराज द्वीप और नील का शहीद द्वीप कर दिया गया था।" },
            { q: "37. विश्व का सबसे बड़ा नदीय द्वीप कौन सा है?", opts: ["पम्बन द्वीप", "कच्चातिवू द्वीप", "आलियाबेट व खालियाबेट", "माजुली द्वीप"], ans: "माजुली द्वीप", exp: "असम में ब्रह्मपुत्र नदी के मध्य स्थित 'माजुली' विश्व का सबसे बड़ा आबाद नदीय (Riverine) द्वीप है। इसे असम का एक जिला भी घोषित किया गया है।" },
            { q: "38. नदियाँ जिस स्थान से निकलती है उस स्थान को क्या कहा जाता है?", opts: ["जलग्रहण क्षेत्र", "जल विभाजक", "उद्गम स्थल", "संगम या मुहाना"], ans: "उद्गम स्थल", exp: "नदी की शुरुआत जिस स्रोत (पहाड़, ग्लेशियर, झील या झरने) से होती है, उसे उसका उद्गम (Origin) स्थल कहते हैं, जबकि जहाँ गिरती है उसे मुहाना कहते हैं।" },
            { q: "39. अफ्रीका महादेश की कौन सी नदी विषुवत रेखा को दो बार काटती है?", opts: ["कांगो / जायरे", "नील", "लिम्पोपो", "बारमेजो"], ans: "कांगो / जायरे", exp: "अफ्रीका की कांगो (जायरे) नदी भूमध्य रेखा (विषुवत रेखा) को दो बार पार करती है। वहीं लिम्पोपो नदी मकर रेखा को दो बार काटती है।" },
            { q: "40. सिंधु नदी का उद्गम कहाँ से होता है?", opts: ["शेषनाग झील", "मानसरोवर झील", "राकसताल", "बरालाचा दर्रा"], ans: "मानसरोवर झील", exp: "सिंधु नदी का उद्गम तिब्बत में कैलाश पर्वतमाला में मानसरोवर झील के पास बोखर चू (Bokhar Chu) हिमनद से होता है।" },
            { q: "41. मंदाकिनी या काली नदी अलकनंदा से कहाँ मिलती है?", opts: ["नंद प्रयाग", "विष्णुप्रयाग", "रुद्र प्रयाग", "कर्ण प्रयाग"], ans: "रुद्र प्रयाग", exp: "उत्तराखंड के रुद्रप्रयाग में केदारनाथ से आने वाली मंदाकिनी नदी और बद्रीनाथ से आने वाली अलकनंदा नदी का संगम होता है।" },
            { q: "42. पश्चिम बंगाल में प्रवेश करने के बाद गंगा की पूर्वी धारा को किस नाम से जाना जाता है?", opts: ["हुगली", "भागीरथी", "पद्मा", "मेघना"], ans: "पद्मा", exp: "फरक्का (पश्चिम बंगाल) के बाद गंगा मुख्य रूप से दो धाराओं में बंटती है, पूर्वी धारा 'पद्मा' बनकर बांग्लादेश में प्रवेश करती है, और पश्चिमी धारा हुगली कहलाती है।" },
            { q: "43. गंगा व यमुना के संगम पर कौन सा शहर बना है?", opts: ["आगरा", "दिल्ली", "प्रयागराज", "काशी"], ans: "प्रयागराज", exp: "प्रयागराज (पूर्व नाम इलाहाबाद) उत्तर प्रदेश का वह पवित्र शहर है जहाँ गंगा, यमुना और पौराणिक सरस्वती नदियों का त्रिवेणी संगम होता है।" },
            { q: "44. बिहार का शोक किस नदी को कहा जाता है?", opts: ["दामोदर नदी", "कोसी नदी", "कावेरी नदी", "गंडक नदी"], ans: "कोसी नदी", exp: "कोसी नदी को अपने भयंकर मार्ग परिवर्तन और उत्तरी बिहार में विनाशकारी बाढ़ लाने के कारण 'बिहार का शोक' (Sorrow of Bihar) कहा जाता है।" },
            { q: "45. ब्रह्मपुत्र नदी को तिब्बत में क्या कहा जाता है?", opts: ["चेमगुंग डुंग", "सांग्पो", "दिहांग या दिबांग", "जमुना"], ans: "सांग्पो", exp: "ब्रह्मपुत्र नदी को तिब्बत में 'यारलुंग सांग्पो' (Tsangpo) कहा जाता है जिसका अर्थ 'शोधक' होता है। अरुणाचल में इसे दिहांग कहते हैं।" },
            { q: "46. ब्रह्मपुत्र नदी पर कौन सा राष्ट्रीय जलमार्ग स्थित है?", opts: ["NW-1", "NW-2", "NW-3", "NW-4"], ans: "NW-2", exp: "राष्ट्रीय जलमार्ग संख्या 2 (National Waterway 2) असम में सादिया से धुबरी तक ब्रह्मपुत्र नदी पर (लगभग 891 किमी) स्थित है।" },
            { q: "47. कौन सी नदी अपने भ्रंश घाटी के लिए प्रसिद्ध है?", opts: ["दामोदर", "कृष्णा", "पारसनाथ पहाड़ी", "पेरियार"], ans: "दामोदर", exp: "नर्मदा और ताप्ती नदियों की तरह दामोदर नदी भी अपनी भ्रंश घाटी (Rift Valley) में बहने के लिए जानी जाती है।" },
            { q: "48. छोटानागपुर की गंगा किस नदी को कहा जाता है?", opts: ["कृष्णा", "कावेरी", "स्वर्ण रेखा", "महानदी"], ans: "स्वर्ण रेखा", exp: "दिए गए विकल्पों में स्वर्ण रेखा नदी छोटानागपुर पठार क्षेत्र की सबसे प्रमुख नदी है (हालाँकि दामोदर को भी यह संज्ञा दी जाती है)। यह रांची के पास से निकलती है।" },
            { q: "49. भारत के सबसे लंबा बांध हीराकुंड बांध का निर्माण किस नदी पर किया गया है?", opts: ["गोदावरी", "महानदी", "कृष्णा", "कावेरी"], ans: "महानदी", exp: "ओडिशा के संबलपुर में महानदी पर बना हीराकुंड बांध भारत का और दुनिया के सबसे लंबे मिट्टी के बांधों में से एक है।" },
            { q: "50. गोदावरी नदी डेल्टा का निर्माण कहाँ करती है?", opts: ["उड़ीसा", "तेलंगाना", "आंध्रप्रदेश", "तमिलनाडु"], ans: "आंध्रप्रदेश", exp: "दक्षिण भारत की सबसे लंबी नदी गोदावरी, आंध्र प्रदेश में राजमुंदरी के पास एक विशाल डेल्टा का निर्माण कर बंगाल की खाड़ी में गिरती है।" },
            { q: "51. अरब सागर में गिरने वाली नदी समूह कौन नहीं है?", opts: ["लूनी, साबरमती, नर्मदा", "ताप्ती, माही, पेरियार", "मांडवी, शरावती", "कृष्णा, कावेरी"], ans: "कृष्णा, कावेरी", exp: "कृष्णा और कावेरी नदियां पूर्वी की ओर बहकर बंगाल की खाड़ी में गिरती हैं, जबकि बाकी सभी नदियां पश्चिम की ओर बहकर अरब सागर में गिरती हैं।" },
            { q: "52. निम्नलिखित में से कौन सी परियोजना चेनाब नदी पर स्थित है?", opts: ["भाखड़ा नांगल परियोजना", "उकाई", "तुलबुल व ऊटी परियोजना", "सलाला, बगलिहार, दुलहस्ती"], ans: "सलाला, बगलिहार, दुलहस्ती", exp: "सलाल, बगलिहार और दुलहस्ती ये तीनों प्रमुख जलविद्युत परियोजनाएं जम्मू-कश्मीर में चिनाब नदी पर विकसित की गई हैं।" },
            { q: "53. मध्य प्रदेश और गुजरात के बीच कौन सा नदी जल विवाद है?", opts: ["कावेरी नदी जल विवाद", "नर्मदा नदी जल विवाद", "कृष्णा नदी जल विवाद", "सोन नदी जल विवाद"], ans: "नर्मदा नदी जल विवाद", exp: "नर्मदा नदी के जल के बंटवारे को लेकर मुख्य रूप से मध्य प्रदेश, गुजरात, महाराष्ट्र और राजस्थान के बीच विवाद रहा है, जिसके लिए नर्मदा जल विवाद न्यायाधिकरण बना।" },
            { q: "54. निम्नलिखित युग्मों में कौन सा कृत्रिम झील का समूह नहीं हैं?", opts: ["गोविंद सागर एवं गांधी सागर", "राणा प्रताप सागर एवं जवाहर सागर", "नागार्जुन सागर एवं पेरियार", "उमियम झील एवं लोकटक"], ans: "उमियम झील एवं लोकटक", exp: "लोकटक (मणिपुर) एक प्राकृतिक मीठे पानी की झील है, जबकि गोविंद सागर, गांधी सागर आदि बांधों के पीछे बने कृत्रिम जलाशय (Artificial Lakes) हैं।" },
            { q: "55. कर्नाटक में शरावती नदी पर कौन सा जलप्रपात है?", opts: ["हुंडरू जलप्रपात", "गरसोप्पा जलप्रपात", "ककोलत जलप्रपात", "गौतमधारा जलप्रपात"], ans: "गरसोप्पा जलप्रपात", exp: "कर्नाटक में शरावती नदी पर जोग या गरसोप्पा (महात्मा गांधी) जलप्रपात स्थित है, जो भारत के सबसे ऊँचे सीधे गिरने वाले झरनों में से एक है।" },
            { q: "56. भारत की जलवायु किस प्रकार की है?", opts: ["उष्ण कटिबंधीय मानसूनी", "उपोष्ण कटिबंधीय", "शीत कटिबंधीय", "शीतोष्ण कटिबंधीय"], ans: "उष्ण कटिबंधीय मानसूनी", exp: "भारत की जलवायु मुख्य रूप से 'उष्णकटिबंधीय मानसूनी' (Tropical Monsoon) प्रकार की है, जिसमें ऋतुओं के अनुसार हवाओं की दिशा बदलती है।" },
            { q: "57. भारतीय जलवायु को प्रभावित करने वाले कारक कौन-कौन हैं?", opts: ["अक्षांश", "हिमालय", "समुद्र तट से दूरी", "उपरोक्त सभी"], ans: "उपरोक्त सभी", exp: "भारत की जलवायु को अक्षांशीय स्थिति, उत्तर में हिमालय पर्वतमाला, समुद्र तल से ऊँचाई और समुद्र से दूरी सभी व्यापक रूप से प्रभावित करते हैं।" },
            { q: "58. भारतीय मानसून को प्रारंभ करने वाली प्रमुख स्थितियाँ कौन-कौन सी है?", opts: ["निम्न दाब व उच्चदाब का बनना", "हवा का बहना", "न्यूनदाब क्षेत्र में वर्षा", "उपरोक्त सभी"], ans: "उपरोक्त सभी", exp: "ग्रीष्म ऋतु में तिब्बत के पठार और उत्तर-पश्चिमी भारत में तीव्र निम्न दाब (Low Pressure) का बनना और हवाओं का दबाव प्रवणता की ओर बहना मानसून को ट्रिगर करता है।" },
            { q: "59. अंतः उष्णकटिबंधीय अभिसरण क्षेत्र (ITCZ) में हमेशा कौन सा क्षेत्र बना रहता है?", opts: ["सामान्य", "न्यूनदाब", "उच्चदाब", "NOT"], ans: "न्यूनदाब", exp: "ITCZ (Inter Tropical Convergence Zone) भूमध्य रेखा के पास स्थित एक अत्यंत निम्न वायुदाब (Low Pressure) वाला क्षेत्र है, जहाँ व्यापारिक पवनें मिलती हैं।" },
            { q: "60. मानसून उत्पत्ति के गत्यात्मक (गतिक) सिद्धांत को किसने दिया?", opts: ["फ्लोन (Flohn)", "एडमंड हैली", "अलमसुदी", "ब्लैनफोर्ड"], ans: "फ्लोन (Flohn)", exp: "मानसून की उत्पत्ति का गत्यात्मक (Dynamic) सिद्धांत एच. फ्लोन (H. Flohn) द्वारा दिया गया था, जो वायुदाब पेटियों (मुख्यतः ITCZ) के खिसकाव पर आधारित है।" },
            { q: "61. भारत के सर्वाधिक क्षेत्रफल पर किस प्रकार की मिट्टी पाई जाती है?", opts: ["काली मिट्टी", "लाल मिट्टी", "जलोढ़ मिट्टी", "लैटेराइट मिट्टी"], ans: "जलोढ़ मिट्टी", exp: "भारत के लगभग 40-43% भाग (उत्तरी मैदान और नदी घाटियों) में जलोढ़ (Alluvial) मिट्टी पाई जाती है, जो कृषि के लिए सर्वाधिक उपजाऊ है।" },
            { q: "62. पुरानी जलोढ़ मिट्टी को अन्य किस नाम से जाना जाता है?", opts: ["खादर", "बांगर", "भाभर", "तराई"], ans: "बांगर", exp: "नदियों द्वारा लाई गई पुरानी जलोढ़ मिट्टी को 'बांगर' कहा जाता है, जबकि नई जलोढ़ मिट्टी को 'खादर' कहा जाता है।" },
            { q: "63. कपास की खेती के लिए सबसे उपयुक्त मिट्टी कौन सी मानी जाती है?", opts: ["काली मिट्टी", "पीली मिट्टी", "पर्वतीय मिट्टी", "मरुस्थलीय मिट्टी"], ans: "काली मिट्टी", exp: "काली मिट्टी में नमी धारण करने की क्षमता अधिक होती है। इसे 'रेगुर मिट्टी' भी कहते हैं और यह कपास की खेती के लिए सर्वोत्तम है।" },
            { q: "64. लाल मिट्टी का लाल रंग किसकी उपस्थिति के कारण होता है?", opts: ["मैग्नीशियम", "फॉस्फोरस", "लौह ऑक्साइड", "पोटाश"], ans: "लौह ऑक्साइड", exp: "लाल मिट्टी में फेरिक ऑक्साइड (लौह ऑक्साइड) की प्रचुरता होती है, जिसके कारण इसका रंग लाल दिखाई देता है।" },
            { q: "65. चाय और कॉफी की खेती के लिए कौन सी मिट्टी उपयुक्त होती है?", opts: ["जलोढ़ मिट्टी", "लाल मिट्टी", "काली मिट्टी", "लैटेराइट मिट्टी"], ans: "लैटेराइट मिट्टी", exp: "लैटेराइट मिट्टी का निर्माण भारी वर्षा वाले क्षेत्रों में निक्षालन (Leaching) से होता है। यह चाय, कॉफी, काजू आदि की बागानी फसलों के लिए उपयुक्त है।" },
            { q: "66. भारत में चंदन की लकड़ी के वन सबसे अधिक कहाँ पाए जाते हैं?", opts: ["शिवालिक की पहाड़ियों में", "नीलगिरि की पहाड़ियों में", "सतपुड़ा की पहाड़ियों में", "अरावली की पहाड़ियों में"], ans: "नीलगिरि की पहाड़ियों में", exp: "चंदन के वन मुख्य रूप से कर्नाटक, तमिलनाडु और केरल की नीलगिरि पहाड़ियों और आसपास के क्षेत्रों में पाए जाते हैं।" },
            { q: "67. प्रसिद्ध 'साइलेंट वैली' (शांत घाटी) किस राज्य में स्थित है?", opts: ["उत्तराखंड", "हिमाचल प्रदेश", "केरल", "सिक्किम"], ans: "केरल", exp: "साइलेंट वैली नेशनल पार्क केरल राज्य के पलक्कड़ जिले में स्थित है। यह अपनी समृद्ध जैव विविधता के लिए प्रसिद्ध है।" },
            { q: "68. मैंग्रोव वनस्पति का मुख्य वृक्ष कौन सा है, जिसके नाम पर सुंदरवन का नाम पड़ा?", opts: ["महोगनी", "सुंदरी", "रोजवुड", "देवदार"], ans: "सुंदरी", exp: "गंगा-ब्रह्मपुत्र डेल्टा में पाए जाने वाले मैंग्रोव वनों में 'सुंदरी' नामक वृक्ष की बहुलता है, इसी कारण इसे सुंदरवन डेल्टा कहा जाता है।" },
            { q: "69. भारत का प्रथम राष्ट्रीय उद्यान 'जिम कॉर्बेट नेशनल पार्क' कहाँ स्थित है?", opts: ["मध्य प्रदेश", "असम", "उत्तराखंड", "राजस्थान"], ans: "उत्तराखंड", exp: "उत्तराखंड में स्थित जिम कॉर्बेट (पूर्व में हैली नेशनल पार्क) भारत का सबसे पुराना राष्ट्रीय उद्यान है, जिसे 1936 में स्थापित किया गया था।" },
            { q: "70. काजीरंगा राष्ट्रीय उद्यान मुख्य रूप से किसके संरक्षण के लिए प्रसिद्ध है?", opts: ["एशियाई शेर", "बाघ", "एक सींग वाले गैंडे", "हाथी"], ans: "एक सींग वाले गैंडे", exp: "असम में स्थित काजीरंगा राष्ट्रीय उद्यान दुनिया में एक सींग वाले गैंडों (One-horned Rhinoceros) की सबसे बड़ी आबादी के लिए प्रसिद्ध है।" },
            { q: "71. भारत में 'हरित क्रांति' का जनक किसे माना जाता है?", opts: ["वर्गीज कुरियन", "एम. एस. स्वामीनाथन", "नॉर्मन बोरलॉग", "सैम पित्रोदा"], ans: "एम. एस. स्वामीनाथन", exp: "डॉ. एम. एस. स्वामीनाथन को भारत में हरित क्रांति का जनक माना जाता है, जिन्होंने उच्च उपज वाली गेहूं की किस्मों को पेश किया।" },
            { q: "72. 'श्वेत क्रांति' (White Revolution) का संबंध मुख्य रूप से किससे है?", opts: ["मत्स्य उत्पादन", "दुग्ध उत्पादन", "अंडा उत्पादन", "कपास उत्पादन"], ans: "दुग्ध उत्पादन", exp: "श्वेत क्रांति का संबंध दूध उत्पादन में तीव्र वृद्धि से है। इसके सूत्रधार डॉ. वर्गीज कुरियन थे।" },
            { q: "73. भारत का सबसे बड़ा मूंगफली (Peanut) उत्पादक राज्य कौन सा है?", opts: ["आंध्र प्रदेश", "गुजरात", "महाराष्ट्र", "तमिलनाडु"], ans: "गुजरात", exp: "गुजरात भारत में मूंगफली का सबसे बड़ा उत्पादक राज्य है। इसके बाद राजस्थान और तमिलनाडु का स्थान आता है।" },
            { q: "74. कॉफी का सबसे बड़ा उत्पादक राज्य भारत में कौन है?", opts: ["केरल", "तमिलनाडु", "कर्नाटक", "असम"], ans: "कर्नाटक", exp: "भारत में कॉफी के कुल उत्पादन का लगभग 70% हिस्सा अकेले कर्नाटक राज्य से आता है।" },
            { q: "75. 'झूम कृषि' (Jhum Cultivation) मुख्य रूप से भारत के किस भाग में की जाती है?", opts: ["दक्षिण भारत", "पूर्वोत्तर भारत", "पश्चिमी भारत", "उत्तरी मैदान"], ans: "पूर्वोत्तर भारत", exp: "झूम कृषि एक प्रकार की स्थानांतरित (Shifting) कृषि है, जो मुख्य रूप से असम, मेघालय, मिजोरम आदि पूर्वोत्तर राज्यों के आदिवासी क्षेत्रों में की जाती है।" },
            { q: "76. दुग्ध उत्पादन को बढ़ाने के लिए 'ऑपरेशन फ्लड' कार्यक्रम किस वर्ष शुरू किया गया था?", opts: ["1960", "1970", "1985", "1991"], ans: "1970", exp: "राष्ट्रीय डेयरी विकास बोर्ड (NDDB) द्वारा 1970 में भारत में ऑपरेशन फ्लड शुरू किया गया था, जिसने भारत को सबसे बड़ा दूध उत्पादक बनाया।" },
            { q: "77. भारत में सबसे अधिक दालों (Pulses) का उत्पादन कौन सा राज्य करता है?", opts: ["मध्य प्रदेश", "उत्तर प्रदेश", "महाराष्ट्र", "राजस्थान"], ans: "मध्य प्रदेश", exp: "मध्य प्रदेश भारत में दलहन (दालों) का सबसे बड़ा उत्पादक राज्य है। इसके बाद महाराष्ट्र और राजस्थान का स्थान है।" },
            { q: "78. केसर (Saffron) का एकमात्र प्रमुख उत्पादक केंद्र शासित प्रदेश/राज्य कौन सा है?", opts: ["हिमाचल प्रदेश", "सिक्किम", "जम्मू-कश्मीर", "उत्तराखंड"], ans: "जम्मू-कश्मीर", exp: "भारत में केसर का वाणिज्यिक उत्पादन मुख्य रूप से जम्मू और कश्मीर की 'करेवा' मिट्टी (विशेषकर पंपोर क्षेत्र) में होता है।" },
            { q: "79. झारखंड की 'जादूगोड़ा की खदानें' किस खनिज के लिए प्रसिद्ध हैं?", opts: ["कोयला", "लौह अयस्क", "यूरेनियम", "सोना"], ans: "यूरेनियम", exp: "झारखंड के सिंहभूम जिले में स्थित जादूगोड़ा खदानें भारत में यूरेनियम खनन के लिए सबसे ज्यादा प्रसिद्ध हैं।" },
            { q: "80. भारत में सबसे पुराना तेल भंडार (Oil Field) कहाँ स्थित है?", opts: ["बॉम्बे हाई, महाराष्ट्र", "अंकलेश्वर, गुजरात", "डिगबोई, असम", "नहरकटिया, असम"], ans: "डिगबोई, असम", exp: "असम का डिगबोई भारत का सबसे पुराना काम करने वाला तेल कुआँ और रिफाइनरी है, जिसे 1901 में चालू किया गया था।" },
            { q: "81. बॉक्साइट का सबसे बड़ा उत्पादक राज्य भारत में कौन सा है?", opts: ["झारखंड", "ओडिशा", "छत्तीसगढ़", "मध्य प्रदेश"], ans: "ओडिशा", exp: "बॉक्साइट (एल्युमिनियम का अयस्क) के उत्पादन और भंडार दोनों में ओडिशा का भारत में प्रथम स्थान है।" },
            { q: "82. खेतड़ी (राजस्थान) की खदानें किस खनिज के लिए ऐतिहासिक रूप से प्रसिद्ध हैं?", opts: ["चांदी", "तांबा", "जस्ता", "अभ्रक"], ans: "तांबा", exp: "राजस्थान के झुंझुनू जिले में स्थित खेतड़ी (Khetri) की खदानें तांबे (Copper) के निष्कर्षण के लिए प्राचीन काल से प्रसिद्ध हैं।" },
            { q: "83. भारत में कोयले का सबसे बड़ा भंडार (Reserves) किस राज्य में है?", opts: ["छत्तीसगढ़", "ओडिशा", "झारखंड", "पश्चिम बंगाल"], ans: "झारखंड", exp: "झारखंड में कोयले का सर्वाधिक भंडार (झरिया, बोकारो आदि) है, हालांकि वर्तमान उत्पादन में छत्तीसगढ़ और ओडिशा भी अग्रणी रहते हैं।" },
            { q: "84. 'स्वर्णिम चतुर्भुज' (Golden Quadrilateral) परियोजना किससे संबंधित है?", opts: ["राष्ट्रीय राजमार्ग", "रेलवे नेटवर्क", "जलमार्ग", "हवाई अड्डे"], ans: "राष्ट्रीय राजमार्ग", exp: "स्वर्णिम चतुर्भुज एक राजमार्ग नेटवर्क है जो भारत के चार प्रमुख महानगरों (दिल्ली, मुंबई, चेन्नई, कोलकाता) को आपस में जोड़ता है।" },
            { q: "85. भारत का सबसे लंबा राष्ट्रीय राजमार्ग कौन सा है?", opts: ["NH-27", "NH-44", "NH-48", "NH-52"], ans: "NH-44", exp: "NH-44 भारत का सबसे लंबा राजमार्ग है, जो उत्तर में श्रीनगर (जम्मू-कश्मीर) से शुरू होकर दक्षिण में कन्याकुमारी (तमिलनाडु) तक जाता है।" },
            { q: "86. कोंकण रेलवे किन दो राज्यों को मुख्य रूप से जोड़ता है?", opts: ["गुजरात और महाराष्ट्र", "महाराष्ट्र और कर्नाटक", "कर्नाटक और केरल", "तमिलनाडु और केरल"], ans: "महाराष्ट्र और कर्नाटक", exp: "कोंकण रेलवे पश्चिमी घाट के किनारे से गुजरता है और महाराष्ट्र (रोहा) को कर्नाटक (मंगलुरु) से जोड़ता है, यह इंजीनियरिंग का एक अद्भुत उदाहरण है।" },
            { q: "87. भारत का सबसे बड़ा प्राकृतिक बंदरगाह कौन सा है?", opts: ["चेन्नई", "विशाखापत्तनम", "कोच्चि", "मुंबई"], ans: "मुंबई", exp: "मुंबई बंदरगाह (महाराष्ट्र) भारत का सबसे बड़ा प्राकृतिक और सर्वाधिक व्यापार करने वाला बंदरगाह है।" },
            { q: "88. कांडला बंदरगाह (अब दीनदयाल बंदरगाह) किस राज्य में स्थित है?", opts: ["गुजरात", "महाराष्ट्र", "ओडिशा", "पश्चिम बंगाल"], ans: "गुजरात", exp: "कांडला एक ज्वारीय (Tidal) बंदरगाह है जो गुजरात में कच्छ की खाड़ी में स्थित है। इसका नाम बदलकर दीनदयाल पोर्ट ट्रस्ट कर दिया गया है।" },
            { q: "89. 2011 की जनगणना के अनुसार भारत का जनसंख्या घनत्व कितना है?", opts: ["324 व्यक्ति/वर्ग किमी", "382 व्यक्ति/वर्ग किमी", "412 व्यक्ति/वर्ग किमी", "394 व्यक्ति/वर्ग किमी"], ans: "382 व्यक्ति/वर्ग किमी", exp: "2011 की जनगणना के अनुसार भारत का जनसंख्या घनत्व 382 व्यक्ति प्रति वर्ग किलोमीटर था, जबकि बिहार का सबसे अधिक (1106) था।" },
            { q: "90. 2011 की जनगणना के अनुसार सबसे अधिक साक्षरता दर किस राज्य की है?", opts: ["मिजोरम", "गोवा", "केरल", "त्रिपुरा"], ans: "केरल", exp: "2011 की जनगणना के अनुसार केरल भारत का सबसे साक्षर राज्य है (लगभग 94%), जबकि बिहार की साक्षरता दर सबसे कम थी।" },
            { q: "91. 2011 की जनगणना के अनुसार भारत का लिंगानुपात (Sex Ratio) कितना है?", opts: ["933", "940", "943", "945"], ans: "943", exp: "2011 की जनगणना के अनुसार भारत का राष्ट्रीय लिंगानुपात प्रति 1000 पुरुषों पर 943 महिलाएँ है।" },
            { q: "92. भारत में सर्वाधिक जनसंख्या वाला राज्य कौन सा है?", opts: ["महाराष्ट्र", "पश्चिम बंगाल", "बिहार", "उत्तर प्रदेश"], ans: "उत्तर प्रदेश", exp: "जनसंख्या के मामले में उत्तर प्रदेश भारत का सबसे बड़ा राज्य है (2011 में लगभग 19.98 करोड़), इसके बाद महाराष्ट्र का नंबर आता है।" },
            { q: "93. किस राज्य में अनुसूचित जनजाति (ST) की जनसंख्या सर्वाधिक है?", opts: ["मध्य प्रदेश", "महाराष्ट्र", "ओडिशा", "झारखंड"], ans: "मध्य प्रदेश", exp: "भारत में संख्या के आधार पर सबसे अधिक आदिवासी या अनुसूचित जनजाति (ST) की आबादी मध्य प्रदेश में निवास करती है।" },
            { q: "94. 'टोडा' जनजाति मुख्य रूप से कहाँ निवास करती है?", opts: ["अंडमान द्वीप", "नीलगिरि की पहाड़ियाँ", "अरावली", "विंध्याचल"], ans: "नीलगिरि की पहाड़ियाँ", exp: "टोडा एक पशुपालक जनजाति है जो मुख्य रूप से तमिलनाडु में नीलगिरि की पहाड़ियों में निवास करती है।" },
            { q: "95. गारो, खासी और जयंतिया जनजातियां किस राज्य से संबंधित हैं?", opts: ["असम", "मेघालय", "नागालैंड", "मिजोरम"], ans: "मेघालय", exp: "मेघालय राज्य में निवास करने वाली इन प्रमुख जनजातियों के नाम पर ही वहाँ की पहाड़ियों (गारो, खासी, जयंतिया) का नाम रखा गया है।" },
            { q: "96. मुंडा और संथाल जनजातियां मुख्य रूप से किस राज्य में पाई जाती हैं?", opts: ["छत्तीसगढ़", "झारखंड", "मध्य प्रदेश", "ओडिशा"], ans: "झारखंड", exp: "संथाल और मुंडा भारत की प्रमुख जनजातियां हैं जिनका मुख्य निवास स्थान छोटानागपुर पठार, विशेषकर झारखंड राज्य है।" },
            { q: "97. दीपावली को 'शोक के पर्व' के रूप में कौन सी जनजाति मनाती है?", opts: ["भोटिया", "गोंड", "थारू", "भील"], ans: "थारू", exp: "थारू जनजाति (जो मुख्य रूप से उत्तराखंड और उत्तर प्रदेश के तराई क्षेत्रों में पाई जाती है) दीपावली को अपने पूर्वजों के शोक पर्व के रूप में मनाती है।" },
            { q: "98. ओंजे (Onge), जारवा (Jarawa) और सेंटिनलीज जनजातियां कहाँ पाई जाती हैं?", opts: ["लक्षद्वीप", "अंडमान और निकोबार", "दमन और दीव", "पूर्वोत्तर भारत"], ans: "अंडमान और निकोबार", exp: "ये सभी अति प्राचीन और संकटग्रस्त जनजातीय समूह अंडमान और निकोबार द्वीप समूह में निवास करते हैं।" },
            { q: "99. भारत का एकमात्र सक्रिय ज्वालामुखी कहाँ स्थित है?", opts: ["नारकोंडम द्वीप", "बैरन द्वीप", "माजुली", "मिनिकॉय"], ans: "बैरन द्वीप", exp: "अंडमान सागर में स्थित बैरन द्वीप (Barren Island) भारत और दक्षिण एशिया का एकमात्र सक्रिय (Active) ज्वालामुखी है।" },
            { q: "100. भारत के किस राज्य की समुद्री तटरेखा सबसे लंबी है?", opts: ["आंध्र प्रदेश", "महाराष्ट्र", "गुजरात", "तमिलनाडु"], ans: "गुजरात", exp: "भारत में गुजरात राज्य की तटरेखा सबसे लंबी (लगभग 1214 किमी) है, इसके बाद आंध्र प्रदेश का दूसरा स्थान है।" },
            
            // 101 to 170
            { q: "101. 'सुरंगम' किस राज्य की पारंपरिक सिंचाई प्रणाली है?", opts: ["कर्नाटक", "तेलंगाना", "तमिलनाडु", "केरल"], ans: "केरल", exp: "सुरंगम केरल (विशेषकर कासरगोड जिले) में उपयोग की जाने वाली एक पारंपरिक जल संचयन और सिंचाई प्रणाली है।" },
            { q: "102. वैसी फसल जिसकी बुआई अक्टूबर-नवंबर में हो तथा कटाई मार्च-अप्रैल में क्या कहलाता है-", opts: ["रबी", "खरीफ", "जायद", "सभी"], ans: "रबी", exp: "सर्दियों की शुरुआत में बोई जाने वाली और गर्मियों में काटी जाने वाली फसलों को रबी फसल (जैसे- गेहूँ, चना, सरसों) कहा जाता है।" },
            { q: "103. किसी एक भूमि पर एक फसल की वर्ष में उत्पादन की बारंबारता क्या कहलाती है-", opts: ["मिश्रित कृषि", "बागानी कृषि", "शस्य गहनता", "गहन कृषि"], ans: "शस्य गहनता", exp: "शस्य गहनता (Cropping Intensity) का अर्थ है एक ही कृषि वर्ष में एक ही खेत में एक से अधिक फसलें उगाना।" },
            { q: "104. जैविक कृषि का जनक किसे माना जाता है?", opts: ["स्टुअर्ट गार्ड", "अलबर्ट हावर्ड", "ब्रूस विल्स", "NOT"], ans: "अलबर्ट हावर्ड", exp: "सर अल्बर्ट हावर्ड को आधुनिक जैविक कृषि (Organic Farming) का जनक माना जाता है। उन्होंने कृषि में प्राकृतिक तरीकों पर जोर दिया।" },
            { q: "105. भारत में हरित क्रांति आने के बाद कहाँ पर 'विस्तृत खेती' का प्रचलन तेजी से बढ़ा-", opts: ["बिहार व उत्तर प्रदेश", "केरल व कर्नाटक", "पंजाब व हरियाणा", "गुजरात व राजस्थान"], ans: "पंजाब व हरियाणा", exp: "हरित क्रांति का सबसे अधिक प्रभाव पंजाब, हरियाणा और पश्चिमी उत्तर प्रदेश में पड़ा, जहाँ आधुनिक मशीनों से विस्तृत खेती शुरू हुई।" },
            { q: "106. स्थानांतरित कृषि को ओडिशा में क्या कहा जाता है-", opts: ["खिल", "कुरूवा", "कोमान / ब्रिंगा", "कुमारी"], ans: "कोमान / ब्रिंगा", exp: "ओडिशा के आदिवासी क्षेत्रों में स्थानांतरित (झूम) कृषि को स्थानीय भाषा में कोमान, ब्रिंगा या पामाडाबी कहा जाता है।" },
            { q: "107. अंगूर के उत्पादन को क्या कहा जाता है-", opts: ["विटीकल्चर", "सेरीकल्चर", "वर्मीकल्चर", "पीसीकल्चर"], ans: "विटीकल्चर", exp: "अंगूर की खेती और उत्पादन के वैज्ञानिक अध्ययन को विटीकल्चर (Viticulture) कहा जाता है।" },
            { q: "108. राष्ट्रीय चावल अनुसंधान केन्द्र कहाँ स्थित है?", opts: ["मनीला", "कटक", "जयपुर", "बेंगलुरु"], ans: "कटक", exp: "भारत का राष्ट्रीय चावल अनुसंधान संस्थान (NRRI) ओडिशा के कटक शहर में स्थित है। (अंतर्राष्ट्रीय मनीला में है)।" },
            { q: "109. चावल किस प्रकार की जलवायु की फसल है?", opts: ["उष्णकटिबंधीय", "शीतोष्ण कटिबंधीय", "भूमध्यसागरीय", "ध्रुवीय"], ans: "उष्णकटिबंधीय", exp: "चावल मुख्य रूप से उष्णकटिबंधीय (Tropical) जलवायु की फसल है, जिसके लिए उच्च तापमान और अधिक वर्षा की आवश्यकता होती है।" },
            { q: "110. निम्नलिखित में से कौन सी गेहूँ की उन्नत किस्में हैं?", opts: ["कल्याण सोना", "सोनालिका", "सुजाता", "उपरोक्त सभी"], ans: "उपरोक्त सभी", exp: "कल्याण सोना, सोनालिका, अर्जुन, और सुजाता भारत में उगाई जाने वाली गेहूँ की प्रमुख उच्च उपज वाली किस्में हैं।" },
            { q: "111. भारत में सबसे ज्यादा गेहूँ का उत्पादन कौन राज्य करता है?", opts: ["पश्चिम बंगाल", "उत्तर प्रदेश", "पंजाब", "मध्य प्रदेश"], ans: "उत्तर प्रदेश", exp: "भारत में गेहूँ के कुल उत्पादन में उत्तर प्रदेश का प्रथम स्थान है, जबकि प्रति हेक्टेयर उत्पादन में पंजाब आगे है।" },
            { q: "112. भारत में सर्वाधिक सिंचित क्षेत्रफल वाली फसल कौन सी है?", opts: ["गेहूँ", "गन्ना", "चावल", "कपास"], ans: "गन्ना", exp: "गन्ना एक नकदी फसल है जिसे पानी की अधिक आवश्यकता होती है, इसलिए गन्ने के कुल क्षेत्रफल का अधिकतम भाग सिंचित है।" },
            { q: "113. चाय की पत्तियों में मुख्य रूप से कौन सा उत्तेजक पदार्थ पाया जाता है?", opts: ["कैफीन", "थीन", "निकोटीन", "उपरोक्त सभी"], ans: "थीन", exp: "चाय में 'थीन' (Theanine/Theine) नामक उत्तेजक पदार्थ पाया जाता है, जबकि कॉफी में कैफीन और तंबाकू में निकोटीन होता है।" },
            { q: "114. भारत में कॉफी (कहवा) का सबसे बड़ा उत्पादक राज्य कौन है?", opts: ["केरल", "तमिलनाडु", "कर्नाटक", "आंध्र प्रदेश"], ans: "कर्नाटक", exp: "भारत में कॉफी के कुल उत्पादन का लगभग 70% हिस्सा अकेले कर्नाटक राज्य की बाबा बुदन पहाड़ियों और आसपास के क्षेत्रों से आता है।" },
            { q: "115. जूट के उत्पादन के लिए किस प्रकार की मिट्टी सबसे उपयुक्त मानी जाती है?", opts: ["काली मिट्टी", "जलोढ़ (दोमट) मिट्टी", "लाल मिट्टी", "लैटेराइट मिट्टी"], ans: "जलोढ़ (दोमट) मिट्टी", exp: "जूट की खेती के लिए नदियों के डेल्टा क्षेत्र की उपजाऊ जलोढ़ (नवीन दोमट) मिट्टी सर्वोत्तम होती है, जैसे पश्चिम बंगाल का क्षेत्र।" },
            { q: "116. विश्व का एकमात्र देश कौन सा है जो 'मूंगा रेशम' (Muga Silk) का उत्पादन करता है?", opts: ["चीन", "जापान", "भारत", "दक्षिण कोरिया"], ans: "भारत", exp: "भारत (विशेषकर असम राज्य) विश्व में मूंगा रेशम का एकमात्र उत्पादक देश है। इसे GI टैग भी प्राप्त है।" },
            { q: "117. निम्नलिखित में से कौन सी एक नकदी (Cash) फसल का उदाहरण है?", opts: ["गेहूँ", "कपास", "मक्का", "बाजरा"], ans: "कपास", exp: "कपास, जूट, गन्ना, और तंबाकू नकदी फसलें हैं, जिन्हें किसान मुख्य रूप से व्यापार और नकद आय के उद्देश्य से उगाते हैं।" },
            { q: "118. भारत में 'हरित क्रांति' का जनक किसे माना जाता है?", opts: ["नॉर्मन बोरलॉग", "वर्गीज कुरियन", "एम. एस. स्वामीनाथन", "सैम पित्रोदा"], ans: "एम. एस. स्वामीनाथन", exp: "कृषि वैज्ञानिक डॉ. एम. एस. स्वामीनाथन को भारत में हरित क्रांति का जनक कहा जाता है, जिन्होंने उच्च उपज वाले बीजों की शुरुआत की।" },
            { q: "119. 'श्वेत क्रांति' से भारत का कौन सा क्षेत्र सर्वाधिक लाभान्वित रहा?", opts: ["मत्स्य उत्पादन", "दुग्ध उत्पादन", "अंडा उत्पादन", "मांस उत्पादन"], ans: "दुग्ध उत्पादन", exp: "श्वेत क्रांति (ऑपरेशन फ्लड) का संबंध दुग्ध उत्पादन में तेजी लाने से है, जिसके जनक डॉ. वर्गीज कुरियन थे।" },
            { q: "120. नदी जोड़ो परियोजना के लिए कौन सी क्रांति का नाम दिया गया?", opts: ["अमृत क्रांति", "रजत क्रांति", "गुलाबी क्रांति", "पीली क्रांति"], ans: "अमृत क्रांति", exp: "भारत में नदियों को आपस में जोड़ने की महत्वाकांक्षी योजना को 'अमृत क्रांति' (Amrit Kranti) का नाम दिया गया है।" },
            { q: "121. भारत में किस क्षेत्र को भारतीय खनिज का 'हृदय स्थल' (Heartland) कहा जाता है?", opts: ["उत्तर-पश्चिमी पेटी", "छोटानागपुर का पठार", "दक्कन का पठार", "हिमालयी क्षेत्र"], ans: "छोटानागपुर का पठार", exp: "झारखंड, ओडिशा और पश्चिम बंगाल में फैले छोटानागपुर पठार को खनिजों की प्रचुरता के कारण भारत का रूर या खनिज हृदय स्थल कहा जाता है।" },
            { q: "122. मैंगनीज का सर्वाधिक उत्पादन भारत के किस राज्य में होता है?", opts: ["मध्य प्रदेश", "महाराष्ट्र", "ओडिशा", "कर्नाटक"], ans: "मध्य प्रदेश", exp: "वर्तमान आंकड़ों के अनुसार, मध्य प्रदेश भारत में मैंगनीज का अग्रणी उत्पादक राज्य है, जबकि सर्वाधिक भंडार ओडिशा में है।" },
            { q: "123. भारत में ताँबे (Copper) के अयस्क का सबसे बड़ा भंडार कहाँ है?", opts: ["झारखंड", "राजस्थान", "मध्य प्रदेश", "ओडिशा"], ans: "राजस्थान", exp: "तांबे का सबसे बड़ा भंडार राजस्थान (विशेषकर खेतड़ी) में है, जबकि सबसे अधिक उत्पादन मध्य प्रदेश के मलंजखंड से होता है।" },
            { q: "124. सीसा (Lead) मुख्य रूप से किस अयस्क से प्राप्त होता है?", opts: ["हेमेटाइट", "बॉक्साइट", "गैलेना", "जिप्सम"], ans: "गैलेना", exp: "सीसा मुख्य रूप से गैलेना (Galena - PbS) नामक अयस्क से प्राप्त किया जाता है। भारत में राजस्थान इसका प्रमुख उत्पादक है।" },
            { q: "125. भारत में बॉक्साइट का शीर्ष उत्पादक राज्य कौन है?", opts: ["गुजरात", "झारखंड", "ओडिशा", "राजस्थान"], ans: "ओडिशा", exp: "एल्युमीनियम के प्रमुख अयस्क बॉक्साइट के उत्पादन और भंडार दोनों में ओडिशा का पूरे भारत में एकाधिकार (लगभग 50%) है।" },
            { q: "126. निम्नलिखित में कौन एक गैर-धात्विक (Non-metallic) खनिज है?", opts: ["तांबा", "अभ्रक (Mica)", "मैंगनीज", "लोहा"], ans: "अभ्रक (Mica)", exp: "अभ्रक, चूना पत्थर, और जिप्सम गैर-धात्विक खनिज हैं, जिनमें कोई धातु अंश नहीं होता।" },
            { q: "127. भारत में माइका (अभ्रक) का शीर्ष उत्पादक राज्य है-", opts: ["आंध्र प्रदेश", "राजस्थान", "ओडिशा", "महाराष्ट्र"], ans: "आंध्र प्रदेश", exp: "आंध्र प्रदेश (विशेषकर नेल्लोर जिला) भारत में अभ्रक का सबसे बड़ा उत्पादक राज्य है।" },
            { q: "128. चूना पत्थर (Limestone) का शीर्ष उत्पादक राज्य कौन करता है?", opts: ["राजस्थान", "मध्य प्रदेश", "छत्तीसगढ़", "आंध्र प्रदेश"], ans: "राजस्थान", exp: "सीमेंट उद्योग के लिए अति आवश्यक चूना पत्थर के उत्पादन में राजस्थान भारत का अग्रणी राज्य है।" },
            { q: "129. निम्नलिखित में से कौन कैल्शियम सल्फेट हाइड्रेट का एक रूप है?", opts: ["चूना पत्थर", "जिप्सम", "अभ्रक", "डोलोमाइट"], ans: "जिप्सम", exp: "जिप्सम एक गैर-धात्विक खनिज है जो रासायनिक रूप से कैल्शियम सल्फेट हाइड्रेट होता है। इसका उपयोग सीमेंट और उर्वरक में होता है।" },
            { q: "130. ऊर्जा संरक्षण के रूप में 'परंपरागत ऊर्जा' के उदाहरण हैं-", opts: ["सौर ऊर्जा", "पवन ऊर्जा", "कोयला व पेट्रोलियम", "बायोगैस"], ans: "कोयला व पेट्रोलियम", exp: "कोयला, पेट्रोलियम, और प्राकृतिक गैस ऊर्जा के परंपरागत (Non-renewable) स्रोत हैं जो लाखों वर्षों में बनते हैं।" },
            { q: "131. भारत में गोंडवानाकालीन कोयले के निक्षेप मुख्य रूप से किस नदी घाटी में मिलते हैं?", opts: ["दामोदर नदी घाटी", "गंगा नदी घाटी", "कावेरी नदी घाटी", "नर्मदा नदी घाटी"], ans: "दामोदर नदी घाटी", exp: "भारत का 98% से अधिक कोयला गोंडवाना क्रम की चट्टानों में पाया जाता है, जो मुख्य रूप से दामोदर, महानदी और गोदावरी नदी घाटियों में स्थित है।" },
            { q: "132. कोयले का सबसे उत्तम कोटि रूप किसे माना जाता है?", opts: ["पीट", "लिग्नाइट", "बिटुमिनस", "एन्थ्रेसाइट"], ans: "एन्थ्रेसाइट", exp: "एन्थ्रेसाइट सबसे उच्च गुणवत्ता वाला कोयला है जिसमें कार्बन की मात्रा 85-95% तक होती है। भारत में यह केवल जम्मू-कश्मीर में मिलता है।" },
            { q: "133. वर्तमान रिपोर्ट के अनुसार भारत में शीर्ष कोयला उत्पादक राज्य कौन सा है?", opts: ["ओडिशा", "झारखंड", "छत्तीसगढ़", "मध्य प्रदेश"], ans: "छत्तीसगढ़", exp: "कोयले के सर्वाधिक भंडार झारखंड में हैं, लेकिन वर्तमान में सबसे अधिक उत्पादन छत्तीसगढ़ और ओडिशा राज्यों द्वारा किया जा रहा है।" },
            { q: "134. भारत का सबसे बड़ा तेलशोधक (Refinery) कारखाना कौन सा है?", opts: ["बरौनी", "डिगबोई", "जामनगर", "बीना"], ans: "जामनगर", exp: "रिलायंस इंडस्ट्रीज द्वारा संचालित गुजरात का जामनगर तेलशोधक कारखाना न केवल भारत बल्कि विश्व की सबसे बड़ी रिफाइनरी है।" },
            { q: "135. खनिज संसाधन पेट्रोलियम का मुख्य उत्पाद कौन-कौन सा है?", opts: ["पेट्रोल व डीजल", "विमान ईंधन", "केरोसिन", "उपरोक्त सभी"], ans: "उपरोक्त सभी", exp: "कच्चे तेल (पेट्रोलियम) के शोधन से पेट्रोल, डीजल, केरोसिन, विमान ईंधन, डामर और पेट्रोकेमिकल उत्पाद प्राप्त होते हैं।" },
            { q: "136. भारत में सबसे ज्यादा सौर ऊर्जा का उत्पादन कौन सा राज्य करता है?", opts: ["गुजरात", "राजस्थान", "तमिलनाडु", "कर्नाटक"], ans: "राजस्थान", exp: "अनुकूल भौगोलिक स्थिति और विशाल मरुस्थलीय भूमि के कारण राजस्थान भारत में सौर ऊर्जा उत्पादन में शीर्ष पर है।" },
            { q: "137. भारत का पहला परमाणु ऊर्जा संयंत्र 1969 में कहाँ स्थापित किया गया था?", opts: ["तारापुर", "रावतभाटा", "कलपक्कम", "नरौरा"], ans: "तारापुर", exp: "महाराष्ट्र के तारापुर में अमेरिका के सहयोग से भारत का पहला व्यावसायिक परमाणु ऊर्जा स्टेशन स्थापित किया गया था।" },
            { q: "138. 'जादूगोड़ा' की खदानें किस परमाणवीय खनिज के लिए प्रसिद्ध हैं?", opts: ["थोरियम", "यूरेनियम", "प्लूटोनियम", "बेरिलियम"], ans: "यूरेनियम", exp: "झारखंड के सिंहभूम में स्थित जादूगोड़ा की खदानें भारत में यूरेनियम के खनन के लिए विश्व विख्यात हैं।" },
            { q: "139. केरल के तटीय रेत (मोनजाइट) में कौन सा बहुमूल्य खनिज पाया जाता है?", opts: ["यूरेनियम", "थोरियम", "स्वर्ण", "हीरा"], ans: "थोरियम", exp: "केरल तट की मोनजाइट रेत में थोरियम के अपार भंडार मौजूद हैं, जो भविष्य के परमाणु ईंधन के रूप में महत्वपूर्ण है।" },
            { q: "140. भारत का खनिज अन्वेषण निगम लिमिटेड (MECL) का मुख्यालय कहाँ स्थित है?", opts: ["कानपुर", "नागपुर", "रायपुर", "जयपुर"], ans: "नागपुर", exp: "मिनरल एक्सप्लोरेशन कॉरपोरेशन लिमिटेड (MECL) का मुख्यालय महाराष्ट्र के नागपुर में स्थित है।" },
            { q: "141. भारत में पहला सफल सूती वस्त्र का कारखाना (1854) कहाँ खोला गया था?", opts: ["मुंबई", "कोलकाता", "सूरत", "अहमदाबाद"], ans: "मुंबई", exp: "हालांकि पहला प्रयास 1818 में कोलकाता में हुआ, लेकिन पहली सफल सूती वस्त्र मिल 1854 में कावसजी डावर द्वारा मुंबई (बॉम्बे) में लगाई गई।" },
            { q: "142. भारत के आजादी के बाद पहली औद्योगिक नीति कब लाई गई?", opts: ["1947", "1948", "1956", "1991"], ans: "1948", exp: "स्वतंत्र भारत की पहली औद्योगिक नीति 6 अप्रैल 1948 को श्यामा प्रसाद मुखर्जी द्वारा संसद में प्रस्तुत की गई थी।" },
            { q: "143. किस उद्योग को 'आधारभूत उद्योग' (Basic Industry) कहा जाता है?", opts: ["सीमेंट उद्योग", "उर्वरक उद्योग", "लौह एवं इस्पात उद्योग", "सूती वस्त्र उद्योग"], ans: "लौह एवं इस्पात उद्योग", exp: "लौह एवं इस्पात उद्योग अन्य सभी भारी, मध्यम और हल्के उद्योगों को कच्चा माल (मशीनरी आदि) प्रदान करता है, इसलिए इसे आधारभूत उद्योग कहते हैं।" },
            { q: "144. भिलाई लौह एवं इस्पात संयंत्र की स्थापना किसके सहयोग से की गई थी?", opts: ["ब्रिटेन", "रूस (सोवियत संघ)", "जर्मनी", "अमेरिका"], ans: "रूस (सोवियत संघ)", exp: "छत्तीसगढ़ में स्थित भिलाई इस्पात संयंत्र की स्थापना द्वितीय पंचवर्षीय योजना में तत्कालीन सोवियत संघ (रूस) के सहयोग से हुई थी।" },
            { q: "145. राउरकेला इस्पात संयंत्र (ओडिशा) किस देश के सहयोग से बनाया गया था?", opts: ["इटली", "जर्मनी", "कनाडा", "फ्रांस"], ans: "जर्मनी", exp: "राउरकेला इस्पात संयंत्र की स्थापना पश्चिम जर्मनी की सहायता से दूसरी पंचवर्षीय योजना के दौरान की गई थी।" },
            { q: "146. दुर्गापुर इस्पात संयंत्र (पश्चिम बंगाल) की स्थापना किस देश की सहायता से हुई?", opts: ["रूस", "ब्रिटेन", "अमेरिका", "जापान"], ans: "ब्रिटेन", exp: "दुर्गापुर इस्पात संयंत्र की स्थापना ग्रेट ब्रिटेन (UK) के सहयोग से द्वितीय पंचवर्षीय योजना में की गई थी।" },
            { q: "147. भारत में डीजल रेलवे इंजन (Diesel Locomotives) का निर्माण मुख्य रूप से कहाँ किया जाता है?", opts: ["वाराणसी", "कपूरथला", "पेरांबूर", "चित्तरंजन"], ans: "वाराणसी", exp: "उत्तर प्रदेश के वाराणसी में स्थित डीजल लोकोमोटिव वर्क्स (DLW) में मुख्य रूप से डीजल और अब इलेक्ट्रिक इंजनों का निर्माण होता है।" },
            { q: "148. भारत में पहला सफल उर्वरक (Fertilizer) संयंत्र 1951 में कहाँ स्थापित किया गया?", opts: ["रानीपेट", "सिंदरी", "ट्रॉम्बे", "आंवला"], ans: "सिंदरी", exp: "स्वतंत्र भारत का पहला प्रमुख रासायनिक उर्वरक कारखाना 1951 में सिंदरी (झारखंड) में स्थापित किया गया था।" },
            { q: "149. भारत का पहला अखबारी कागज (Newsprint) उद्योग कहाँ स्थापित किया गया?", opts: ["नेपानगर", "सेरामपुर", "टीटागढ़", "राजमुंदरी"], ans: "नेपानगर", exp: "मध्य प्रदेश के बुरहानपुर जिले में स्थित नेपानगर भारत के पहले अखबारी कागज कारखाने (नेपा मिल्स लिमिटेड) के लिए प्रसिद्ध है।" },
            { q: "150. कृषि के बाद भारत में दूसरा सर्वाधिक रोजगार देने वाला उद्योग कौन सा है?", opts: ["लौह इस्पात उद्योग", "सूती वस्त्र उद्योग", "चीनी उद्योग", "आईटी उद्योग"], ans: "सूती वस्त्र उद्योग", exp: "वस्त्र उद्योग (Textile Industry) भारतीय अर्थव्यवस्था में कृषि के बाद रोजगार का दूसरा सबसे बड़ा स्रोत है।" },
            { q: "151. 'दक्षिण भारत का मैनचेस्टर' किसे कहा जाता है?", opts: ["चेन्नई", "कोयंबटूर", "मदुरै", "बेंगलुरु"], ans: "कोयंबटूर", exp: "तमिलनाडु के कोयंबटूर को सूती वस्त्र मिलों की भारी संख्या और उत्पादन के कारण दक्षिण भारत का मैनचेस्टर कहा जाता है।" },
            { q: "152. भारत में चीनी (Sugar) का सर्वाधिक उत्पादक राज्य कौन है?", opts: ["मध्य प्रदेश", "कर्नाटक", "उत्तर प्रदेश", "राजस्थान"], ans: "उत्तर प्रदेश", exp: "गन्ने की सर्वाधिक पैदावार के कारण उत्तर प्रदेश और महाराष्ट्र भारत के सबसे बड़े चीनी उत्पादक राज्य हैं।" },
            { q: "153. भारत के प्रमुख चर्म शोधनशालाएँ (Leather Tanneries) मुख्य रूप से कहाँ स्थित हैं?", opts: ["कानपुर व चेन्नई", "सूरत व अहमदाबाद", "इंदौर व भोपाल", "पुणे व नासिक"], ans: "कानपुर व चेन्नई", exp: "उत्तर प्रदेश का कानपुर और तमिलनाडु का चेन्नई भारत में चमड़ा उद्योग और चर्म शोधन के सबसे बड़े केंद्र हैं।" },
            { q: "154. भारत में नई औद्योगिक नीति (उदारीकरण, निजीकरण एवं वैश्वीकरण - LPG) की घोषणा कब की गई?", opts: ["1985", "1991", "1995", "2000"], ans: "1991", exp: "24 जुलाई 1991 को प्रधानमंत्री पी.वी. नरसिम्हा राव और वित्त मंत्री मनमोहन सिंह ने नई आर्थिक/औद्योगिक नीति (LPG) की घोषणा की थी।" },
            { q: "155. भारत में 'सिलिकॉन वैली' के रूप में किस शहर को जाना जाता है?", opts: ["पुणे", "हैदराबाद", "बेंगलुरु", "गुरुग्राम"], ans: "बेंगलुरु", exp: "आईटी (Information Technology) उद्योग के विशाल विकास के कारण कर्नाटक की राजधानी बेंगलुरु को भारत की सिलिकॉन वैली कहा जाता है।" },
            { q: "156. भारतीय राष्ट्रीय राजमार्ग प्राधिकरण (NHAI) की स्थापना कब हुई थी?", opts: ["1988", "1995", "2000", "2005"], ans: "1988", exp: "राष्ट्रीय राजमार्गों के विकास और रखरखाव के लिए 1988 में संसद के एक अधिनियम द्वारा NHAI की स्थापना की गई थी, जिसने 1995 में पूर्ण रूप से कार्य शुरू किया।" },
            { q: "157. 'स्वर्णिम चतुर्भुज' परियोजना के तहत किन चार महानगरों को जोड़ा गया है?", opts: ["दिल्ली-मुंबई-चेन्नई-कोलकाता", "दिल्ली-अहमदाबाद-पुणे-बेंगलुरु", "श्रीनगर-कन्याकुमारी-पोरबंदर-सिल्चर", "NOT"], ans: "दिल्ली-मुंबई-चेन्नई-कोलकाता", exp: "स्वर्णिम चतुर्भुज 5846 किमी लंबा राजमार्ग नेटवर्क है जो भारत के चार प्रमुख महानगरों को आपस में जोड़ता है।" },
            { q: "158. भारत का सबसे लंबा राष्ट्रीय राजमार्ग (NH) कौन सा है?", opts: ["NH-7", "NH-44", "NH-27", "NH-48"], ans: "NH-44", exp: "NH-44 (पुराना नाम NH-7) भारत का सबसे लंबा राजमार्ग है जो श्रीनगर (जम्मू-कश्मीर) को कन्याकुमारी (तमिलनाडु) से जोड़ता है।" },
            { q: "159. भारत में सड़क घनत्व सर्वाधिक किस राज्य में है?", opts: ["गोवा", "केरल", "पंजाब", "महाराष्ट्र"], ans: "केरल", exp: "भौगोलिक स्थिति और घनी आबादी के कारण भारत में केरल राज्य में सड़क घनत्व (प्रति 100 वर्ग किमी) सबसे अधिक है।" },
            { q: "160. सीमा सड़क संगठन (BRO) किस मंत्रालय के अधीन कार्य करता है?", opts: ["सड़क परिवहन मंत्रालय", "गृह मंत्रालय", "रक्षा मंत्रालय", "सीमा प्रबंधन विभाग"], ans: "रक्षा मंत्रालय", exp: "BRO की स्थापना 1960 में हुई थी। यह रक्षा मंत्रालय के अधीन भारत के सीमावर्ती क्षेत्रों में सड़कों का निर्माण और रखरखाव करता है।" },
            { q: "161. 'कोंकण रेलवे' का विस्तार मुख्य रूप से किन राज्यों में है?", opts: ["गुजरात-महाराष्ट्र", "महाराष्ट्र-गोवा-कर्नाटक", "कर्नाटक-केरल", "तमिलनाडु-केरल"], ans: "महाराष्ट्र-गोवा-कर्नाटक", exp: "कोंकण रेलवे पश्चिमी घाट के दुर्गम इलाकों से होकर गुजरती है, जो महाराष्ट्र के रोहा को कर्नाटक के मंगलुरु से जोड़ती है।" },
            { q: "162. भारत में पहली मेट्रो रेल सेवा 1984 में कहाँ शुरू की गई थी?", opts: ["दिल्ली", "चेन्नई", "मुंबई", "कोलकाता"], ans: "कोलकाता", exp: "भारत की पहली भूमिगत मेट्रो रेल सेवा 24 अक्टूबर 1984 को कोलकाता में शुरू की गई थी।" },
            { q: "163. दार्जिलिंग हिमालयन रेलवे को यूनेस्को (UNESCO) विश्व धरोहर स्थल में कब शामिल किया गया?", opts: ["1995", "1999", "2004", "2008"], ans: "1999", exp: "अपने अद्भुत इंजीनियरिंग कौशल और पर्वतीय सुंदरता के लिए 1999 में इसे विश्व धरोहर सूची में शामिल किया गया था।" },
            { q: "164. राष्ट्रीय जलमार्ग-1 (NW-1) किस नदी पर और कहाँ से कहाँ तक स्थित है?", opts: ["ब्रह्मपुत्र: सादिया-धुबरी", "गंगा: प्रयागराज-हल्दिया", "गोदावरी: काकीनाडा-पुडुचेरी", "कृष्णा: विजयवाड़ा-वजीराबाद"], ans: "गंगा: प्रयागराज-हल्दिया", exp: "NW-1 भारत का सबसे लंबा (1620 किमी) राष्ट्रीय जलमार्ग है जो गंगा-भागीरथी-हुगली नदी प्रणाली पर प्रयागराज से हल्दिया तक है।" },
            { q: "165. राष्ट्रीय जलमार्ग-2 (NW-2) किस नदी पर स्थित है?", opts: ["गंगा", "ब्रह्मपुत्र", "महानदी", "नर्मदा"], ans: "ब्रह्मपुत्र", exp: "NW-2 असम में ब्रह्मपुत्र नदी पर सादिया से धुबरी (891 किमी) तक फैला हुआ है।" },
            { q: "166. भारत का सबसे गहरा और लैंडलॉक्ड (Landlocked) प्राकृतिक बंदरगाह कौन सा है?", opts: ["पारादीप", "विशाखापत्तनम", "कोच्चि", "मुंबई"], ans: "विशाखापत्तनम", exp: "आंध्र प्रदेश का विशाखापत्तनम बंदरगाह डॉल्फिन नोज़ नामक पहाड़ी के पीछे सुरक्षित, भारत का सबसे गहरा प्राकृतिक बंदरगाह है।" },
            { q: "167. भारत के किस बंदरगाह को 'रसायन बंदरगाह' (Chemical Port) भी कहा जाता है?", opts: ["दाहेज", "पारादीप", "तूतीकोरिन", "मंगलुरु"], ans: "दाहेज", exp: "गुजरात के दाहेज बंदरगाह को रसायनों के सुरक्षित निपटान और व्यापार के लिए विशेष रूप से विकसित किया गया है, इसलिए इसे रसायन बंदरगाह कहते हैं।" },
            { q: "168. ज्वारीय (Tidal) बंदरगाह का प्रमुख उदाहरण कौन सा है?", opts: ["चेन्नई", "कांडला (दीनदयाल)", "एन्नोर", "मर्मगाओ"], ans: "कांडला (दीनदयाल)", exp: "कच्छ की खाड़ी (गुजरात) में स्थित कांडला एक प्रमुख ज्वारीय बंदरगाह है। इसका नया नाम दीनदयाल बंदरगाह है।" },
            { q: "169. भारत में स्थापित पहली खनिज तेल पाइपलाइन (1962) कहाँ से कहाँ तक बिछाई गई थी?", opts: ["हजीरा-विजयपुर-जगदीशपुर", "नाहरकटिया से नूनमती (असम)", "सलाया-मथुरा", "मुंबई हाई-उरण"], ans: "नाहरकटिया से नूनमती (असम)", exp: "भारत की पहली क्रूड ऑयल पाइपलाइन असम के नाहरकटिया तेल क्षेत्र से नूनमती रिफाइनरी तक बिछाई गई थी, जिसे बाद में बरौनी तक बढ़ाया गया।" },
            { q: "170. 'प्रधानमंत्री ग्राम सड़क योजना' (PMGSY) की शुरुआत कब की गई थी?", opts: ["25 दिसंबर 2000", "26 जनवरी 2001", "15 अगस्त 2004", "2 अक्टूबर 2005"], ans: "25 दिसंबर 2000", exp: "पूर्व प्रधानमंत्री अटल बिहारी वाजपेयी के जन्मदिन (25 दिसंबर 2000) पर असंबद्ध ग्रामीण बस्तियों को बारहमासी सड़कों से जोड़ने के लिए यह योजना शुरू की गई थी।" },
            
            // 171 to 251
            { q: "171. डॉ. भीमराव अंबेडकर की स्मृति में कौन सा एक्सप्रेस चलाया गया?", opts: ["रामायण एक्सप्रेस", "समानता एक्सप्रेस", "वंदे भारत एक्सप्रेस", "रामसेतु एक्सप्रेस"], ans: "समानता एक्सप्रेस", exp: "बाबा साहेब डॉ. भीमराव अंबेडकर की स्मृति और उनके जीवन से जुड़े महत्वपूर्ण स्थानों के दर्शन हेतु 'समानता एक्सप्रेस' (Samanta Express) ट्रेन चलाई गई थी।" },
            { q: "172. मांडवी और जुआरी नदी के किनारे स्थित कौन सा प्राकृतिक बंदरगाह स्थित है?", opts: ["मंगलुरु बंदरगाह", "पाराद्वीप बंदरगाह", "मार्मुगाओ बंदरगाह", "तूतीकोरीन बंदरगाह"], ans: "मार्मुगाओ बंदरगाह", exp: "गोवा में स्थित मार्मुगाओ बंदरगाह (Mormugao Port) एक प्रमुख प्राकृतिक बंदरगाह है जो जुआरी नदी के मुहाने पर स्थित है।" },
            { q: "173. केरल के कोल्लम से कोट्टापुरम के बीच कौन सा राष्ट्रीय जलमार्ग स्थित है?", opts: ["NW-1", "NW-2", "NW-3", "NW-4"], ans: "NW-3", exp: "राष्ट्रीय जलमार्ग-3 (NW-3) केरल में पश्चिमी तट नहर (West Coast Canal) पर कोल्लम से कोट्टापुरम तक 205 किमी लंबा है।" },
            { q: "174. किस बंदरगाह को 'रसायन बंदरगाह' (Chemical Port) कहा जाता है?", opts: ["दाहेज", "पारादीप", "तूतीकोरीन", "मंगलुरु"], ans: "दाहेज", exp: "गुजरात के दाहेज बंदरगाह को रसायनों के आयात-निर्यात और सुरक्षित हैंडलिंग के लिए विकसित किया गया है, इसलिए इसे रसायन बंदरगाह कहते हैं।" },
            { q: "175. भारत में स्थापित पहली पाइपलाइन नाहरकटिया से नूनमती के बीच कब चलाई गई?", opts: ["1960", "1962", "1963", "1964"], ans: "1962", exp: "असम के नाहरकटिया तेल क्षेत्र से नूनमती रिफाइनरी तक भारत की पहली कच्चा तेल पाइपलाइन 1962 में चालू की गई थी।" },
            { q: "176. प्रधानमंत्री ग्राम सड़क योजना की शुरुआत कब की गई?", opts: ["25 दिसंबर, 2000", "25 जनवरी, 2000", "15 अगस्त, 2001", "2 अक्टूबर, 2005"], ans: "25 दिसंबर, 2000", exp: "पूर्व प्रधानमंत्री अटल बिहारी वाजपेयी के जन्मदिन 25 दिसंबर 2000 को असंबद्ध ग्रामीण बस्तियों को पक्की सड़कों से जोड़ने हेतु यह योजना शुरू हुई।" },
            { q: "177. उष्ण कटिबंधीय वन के वैसे क्षेत्र जहाँ अपेक्षाकृत कम वर्षा होती है, उसे कहा जाता है?", opts: ["अर्द्ध पर्णपाती वन", "शुष्क वन", "सदाबहार वन", "पर्वतीय वन"], ans: "शुष्क वन", exp: "जहाँ वर्षा 50 सेमी से 100 सेमी के बीच होती है, वहाँ उष्ण कटिबंधीय शुष्क पर्णपाती वन (Dry Deciduous Forests) पाए जाते हैं।" },
            { q: "178. आर्द्र पर्णपाती वन (Moist Deciduous Forests) में कौन से प्रमुख वृक्ष उगते हैं?", opts: ["चंदन व सागवान", "सिल्वर फर", "देवदार", "नागफनी"], ans: "चंदन व सागवान", exp: "भारत में सबसे व्यापक रूप से पाए जाने वाले आर्द्र पर्णपाती वनों के मुख्य वृक्ष सागौन (सागवान), साल, शीशम, महुआ और चंदन हैं।" },
            { q: "179. ऊँचाई बढ़ने के साथ-साथ हिमालय पर्वत श्रृंखला में किस प्रकार की वनस्पति मिलती है?", opts: ["टुंड्रा", "कंटीले", "मैंग्रोव", "पलाश"], ans: "टुंड्रा", exp: "हिमालय में ऊँचाई बढ़ने पर तापमान घटता है, जिससे वनस्पति में बदलाव आता है और अत्यधिक ऊँचाई पर टुंड्रा (अल्पाइन) वनस्पति पाई जाती है।" },
            { q: "180. चीड़ (Pine) के वृक्ष से क्या प्राप्त होता है जिससे तारपीन का तेल बनाया जाता है?", opts: ["प्रोटीन", "लीसा (Resin)", "रबड़", "कत्था"], ans: "लीसा (Resin)", exp: "चीड़ के पेड़ों से लीसा (Resin) नामक राल प्राप्त होती है, जिसका उपयोग तारपीन का तेल (Turpentine oil) और रोसिन बनाने में किया जाता है।" },
            { q: "181. हिमालय श्रेणी के 3000-4000 मीटर की ऊँचाई पर कौन-से वृक्ष मुख्यतः मिलते हैं?", opts: ["सिल्वर फर व पाइन", "सागवान", "सुंदरी", "शीशम"], ans: "सिल्वर फर व पाइन", exp: "3000 से 4000 मीटर की ऊँचाई वाले अल्पाइन क्षेत्रों में मुख्य रूप से सिल्वर फर, पाइन (देवदार), जूनिपर और बर्च के वृक्ष मिलते हैं।" },
            { q: "182. नीलगिरी, अन्नामलाई और पालनी पहाड़ी पर पाए जाने वाले शीतोष्ण कटिबंधीय वनों को क्या कहा जाता हैं?", opts: ["शोलास (Sholas)", "अल्पाइन वन", "मैंग्रोव", "टेगा"], ans: "शोलास (Sholas)", exp: "दक्षिण भारत की नीलगिरि, अन्नामलाई और पालनी पहाड़ियों के उच्च तुंगता वाले क्षेत्रों में पाए जाने वाले समशीतोष्ण वनों को स्थानीय भाषा में 'शोलास' कहा जाता है।" },
            { q: "183. उच्च जैव-विविधता वाले वेलांचली वन (Littoral forests) को और किस अन्य नाम से जाना जाता हैं?", opts: ["मैंग्रोव वन", "अनूप वन", "ज्वारीय वन", "उपरोक्त सभी"], ans: "उपरोक्त सभी", exp: "तटीय और डेल्टाई क्षेत्रों में पाए जाने वाले इन वनों को मैंग्रोव, ज्वारीय वन (Tidal forests), या अनूप (Swamp) वन भी कहा जाता है।" },
            { q: "184. आर्द्रभूमि संरक्षण सम्मेलन 'रामसर सम्मेलन' का आयोजन ईरान में कब किया गया?", opts: ["1970", "1971", "1972", "1973"], ans: "1971", exp: "विश्व की आर्द्रभूमियों (Wetlands) के संरक्षण के लिए 2 फरवरी 1971 को ईरान के रामसर शहर में इस अंतर्राष्ट्रीय संधि पर हस्ताक्षर किए गए थे।" },
            { q: "185. भारत का पहला रामसर स्थल कौन-सा हैं?", opts: ["चिल्का झील", "रेणुका झील", "काँवर झील", "नागा पक्षी अभ्यारण्य"], ans: "चिल्का झील", exp: "ओडिशा की चिल्का झील और राजस्थान के केवलादेव राष्ट्रीय उद्यान को 1981 में भारत के पहले रामसर स्थलों के रूप में मान्यता दी गई थी।" },
            { q: "186. भारत में वन्यजीव संरक्षण अधिनियम (Wildlife Protection Act) कब लाया गया?", opts: ["1952", "1972", "1980", "1986"], ans: "1972", exp: "वन्यजीवों के अवैध शिकार और व्यापार को रोकने के लिए भारत सरकार ने 1972 में वन्यजीव संरक्षण अधिनियम पारित किया।" },
            { q: "187. यूनेस्को ने 1989 में किस जैवमंडल आरक्षित क्षेत्र को बी.आर. नेटवर्क में शामिल किया?", opts: ["मन्नार की खाड़ी", "नीलगिरी", "सुंदरवन", "नंदा देवी"], ans: "मन्नार की खाड़ी", exp: "मन्नार की खाड़ी (Gulf of Mannar) को 1989 में भारत सरकार द्वारा बायोस्फीयर रिजर्व घोषित किया गया और बाद में यूनेस्को ने मान्यता दी। (नीलगिरी पहला था)।" },
            { q: "188. जैवमंडल आरक्षित क्षेत्र 'सिमलीपाल' कहाँ स्थित हैं?", opts: ["मेघालय", "तमिलनाडु", "ओडिशा", "मध्य प्रदेश"], ans: "ओडिशा", exp: "सिमलीपाल राष्ट्रीय उद्यान और बायोस्फीयर रिजर्व ओडिशा के मयूरभंज जिले में स्थित है, जो हाथियों और बाघों के लिए प्रसिद्ध है।" },
            { q: "189. वन्य जीव सुरक्षा के लिए 'प्रोजेक्ट टाईगर' (Project Tiger) कब लाया गया?", opts: ["1972", "1973", "1975", "1992"], ans: "1973", exp: "बाघों की घटती आबादी को बचाने के लिए 1 अप्रैल 1973 को जिम कॉर्बेट नेशनल पार्क से 'प्रोजेक्ट टाइगर' की शुरुआत की गई।" },
            { q: "190. अरूणाचल प्रदेश में कौन-सा नेशनल पार्क स्थित हैं?", opts: ["नामदफा", "मानस NP", "काजीरंगा NP", "सुल्तानपुर NP"], ans: "नामदफा", exp: "नामदफा राष्ट्रीय उद्यान अरुणाचल प्रदेश में स्थित है, जो क्षेत्रफल के हिसाब से भारत के सबसे बड़े राष्ट्रीय उद्यानों में से एक है।" },
            { q: "191. निम्नलिखित वन्यजीव अभ्यारण्य में से कौन तमिलनाडु में स्थित हैं?", opts: ["भीतरकनिका", "अन्नामलाई", "पेरियार", "नागार्जुन सागर"], ans: "अन्नामलाई", exp: "अन्नामलाई वन्यजीव अभयारण्य (जिसे अब इंदिरा गांधी वन्यजीव अभयारण्य कहा जाता है) तमिलनाडु राज्य में स्थित है।" },
            { q: "192. भारतीय वन सर्वेक्षण (FSI) का मुख्यालय कहाँ स्थित हैं?", opts: ["नागपुर", "देहरादून", "बेंगलुरु", "भोपाल"], ans: "देहरादून", exp: "भारतीय वन सर्वेक्षण (Forest Survey of India) पर्यावरण मंत्रालय के अधीन एक संगठन है, जिसका मुख्यालय उत्तराखंड के देहरादून में है।" },
            { q: "193. छत्तीसगढ़ में स्थित बाघ आरक्षित क्षेत्र कौन-सा हैं?", opts: ["गुरू घासीदास टाइगर रिजर्व", "कैमूर टाइगर रिजर्व", "पेंच टाइगर रिजर्व", "बांधवगढ़ टाइगर रिजर्व"], ans: "गुरू घासीदास टाइगर रिजर्व", exp: "गुरू घासीदास राष्ट्रीय उद्यान (तमोर पिंगला के साथ) छत्तीसगढ़ का प्रमुख टाइगर रिजर्व है। पेंच और बांधवगढ़ मध्य प्रदेश में हैं।" },
            { q: "194. कत्था बनाने के लिए किस वृक्ष के लकड़ी का प्रयोग किया जाता हैं?", opts: ["तेंदू", "पलाश", "खैर", "खेजड़ी"], ans: "खैर", exp: "पान में उपयोग होने वाला 'कत्था' (Catechu) मुख्य रूप से खैर (Acacia catechu) नामक वृक्ष की लकड़ी और छाल से निकाला जाता है।" },
            { q: "195. निम्नलिखित में से किसको 'जंगल की आग' (Flame of the Forest) कहा जाता हैं?", opts: ["नागफनी", "चीड़", "पलाश", "सिल्वर फर्न"], ans: "पलाश", exp: "पलाश (Butea monosperma) के फूलों का रंग इतना चटख लाल-नारंगी होता है कि वसंत ऋतु में जंगल में आग लगने जैसा प्रतीत होता है।" },
            { q: "196. भारत के क्षेत्र में मूंगा चट्टान (Coral Reefs) कहाँ स्थित हैं?", opts: ["लक्षद्वीप", "मन्नार की खाड़ी", "कच्छ की खाड़ी", "उपरोक्त सभी"], ans: "उपरोक्त सभी", exp: "भारत में प्रवाल भित्तियाँ (मूंगा चट्टानें) मुख्य रूप से लक्षद्वीप, अंडमान-निकोबार, मन्नार की खाड़ी और कच्छ की खाड़ी में पाई जाती हैं।" },
            { q: "197. सर्वप्रथम दशकीय जनगणना की शुरूआत अमेरिका में कब से शुरू हुई?", opts: ["1749", "1790", "1801", "1872"], ans: "1790", exp: "विश्व में आधुनिक नियमित दशकीय (हर 10 वर्ष में) जनगणना की शुरुआत 1790 में संयुक्त राज्य अमेरिका से मानी जाती है।" },
            { q: "198. भारतीय जनगणना में किस जनगणना को 'महान विभाजक' (Great Divide) की संज्ञा दी गई?", opts: ["1921", "1951", "1981", "2001"], ans: "1921", exp: "1911-1921 के दशक में महामारियों के कारण भारत की जनसंख्या में नकारात्मक वृद्धि (-0.31%) हुई थी, इसलिए 1921 को महान विभाजक वर्ष कहा जाता है।" },
            { q: "199. भारत सरकार ने पहली राष्ट्रीय जनसंख्या नीति की घोषणा कब की?", opts: ["1971", "1976", "1986", "2000"], ans: "1976", exp: "भारत सरकार ने 1976 में पहली राष्ट्रीय जनसंख्या नीति की घोषणा की थी, जिसमें जनसंख्या नियंत्रण के उपाय सुझाए गए थे।" },
            { q: "200. राष्ट्रीय जनगणना 2011 के अनुसार भारत में पुरुषों की संख्या कितनी प्रतिशत हैं?", opts: ["48.53%", "51.47%", "50.00%", "52.12%"], ans: "51.47%", exp: "2011 की जनगणना के अनुसार भारत की कुल 121 करोड़ आबादी में पुरुषों का प्रतिशत लगभग 51.47% और महिलाओं का 48.53% था।" },
            { q: "201. 2011 की जनगणना के अनुसार भारत में किस राज्य की जनसंख्या सर्वाधिक हैं?", opts: ["महाराष्ट्र", "मध्य प्रदेश", "उत्तर प्रदेश", "बिहार"], ans: "उत्तर प्रदेश", exp: "2011 की जनगणना के अनुसार उत्तर प्रदेश लगभग 19.98 करोड़ की आबादी के साथ भारत का सबसे अधिक जनसंख्या वाला राज्य है।" },
            { q: "202. राष्ट्रीय जनगणना 2011 के अनुसार भारत का जनघनत्व (Population Density) कितना हैं?", opts: ["325", "382", "412", "1106"], ans: "382", exp: "भारत का राष्ट्रीय जनसंख्या घनत्व 382 व्यक्ति प्रति वर्ग किलोमीटर था (2011 के अनुसार)। बिहार में यह सर्वाधिक (1106) था।" },
            { q: "203. राष्ट्रीय जनगणना 2011 के अनुसार भारत की साक्षरता दर कितनी हैं?", opts: ["65.46%", "74.04%", "82.14%", "70.04%"], ans: "74.04%", exp: "2011 के अंतिम आंकड़ों के अनुसार भारत की कुल साक्षरता दर 74.04% थी (पुरुष 82.14% और महिला 65.46%)।" },
            { q: "204. राष्ट्रीय जनगणना 2011 के अनुसार सर्वाधिक साक्षरता वाला राज्य कौन सा हैं?", opts: ["बिहार", "केरल", "लक्षद्वीप", "मिजोरम"], ans: "केरल", exp: "केरल 2011 की जनगणना के अनुसार 93.91% (लगभग 94%) साक्षरता दर के साथ शीर्ष राज्य है।" },
            { q: "205. 2011 की जनगणना के अनुसार भारत का लिंगानुपात (Sex Ratio) कितना हैं?", opts: ["933", "940", "943", "953"], ans: "943", exp: "2011 की जनगणना के अनुसार भारत में प्रति 1000 पुरुषों पर महिलाओं की संख्या 943 है।" },
            { q: "206. राष्ट्रीय जनगणना 2011 के अनुसार किस UT (केंद्रशासित प्रदेश) का लिंगानुपात सर्वाधिक है?", opts: ["दमन व दीव", "पुदुचेरी", "लक्षद्वीप", "चंडीगढ़"], ans: "पुदुचेरी", exp: "पुदुचेरी केंद्रशासित प्रदेशों में सबसे अधिक लिंगानुपात (1037 महिलाएँ प्रति 1000 पुरुष) वाला क्षेत्र है।" },
            { q: "207. राष्ट्रीय जनगणना 2011 के अनुसार भारत की दशकीय वृद्धि (Decadal Growth) कितनी रही?", opts: ["17.3%", "17.5%", "17.7%", "21.5%"], ans: "17.7%", exp: "2001 से 2011 के दशक के दौरान भारत की जनसंख्या में 17.7% की दशकीय वृद्धि दर्ज की गई थी।" },
            { q: "208. राष्ट्रीय जनगणना 2011 के अनुसार सर्वाधिक दशकीय वृद्धि वाला राज्य हैं?", opts: ["मेघालय", "नागालैंड", "दादर व नगर हवेली", "अरुणाचल प्रदेश"], ans: "मेघालय", exp: "राज्यों में मेघालय ने सर्वाधिक 27.9% की दशकीय वृद्धि दर्ज की। (नागालैंड में नकारात्मक वृद्धि -0.6% दर्ज की गई थी)।" },
            { q: "209. राष्ट्रीय जनगणना 2011 के अनुसार भारत का शिशु लिंगानुपात (Child Sex Ratio 0-6 yrs) कितना हैं?", opts: ["914", "919", "923", "927"], ans: "919", exp: "2011 की जनगणना के अनुसार भारत का राष्ट्रीय शिशु लिंगानुपात (0-6 वर्ष) 919 था, जो 2001 (927) के मुकाबले कम हुआ था।" },
            { q: "210. राष्ट्रीय जनगणना 2011 के अनुसार भारत में सर्वाधिक शिशु लिंगानुपात (972) किस राज्य का हैं?", opts: ["हरियाणा", "अरुणाचल प्रदेश", "केरल", "मिजोरम"], ans: "अरुणाचल प्रदेश", exp: "अरुणाचल प्रदेश में शिशु लिंगानुपात देश के राज्यों में सबसे अधिक 972 दर्ज किया गया था।" },
            { q: "211. भारत में जनगणना कराने का प्रावधान संविधान की किस अनुसूची में है?", opts: ["5वीं", "7वीं", "8वीं", "9वीं"], ans: "7वीं", exp: "जनगणना संघ सूची का विषय है, जिसका उल्लेख संविधान की 7वीं अनुसूची के अनुच्छेद 246 के तहत किया गया है।" },
            { q: "212. राष्ट्रीय जनगणना 2011 के अनुसार न्यूनतम लिंगानुपात वाला राज्य कौन सा हैं?", opts: ["केरल", "बिहार", "हरियाणा", "पंजाब"], ans: "हरियाणा", exp: "2011 की जनगणना के अनुसार हरियाणा का लिंगानुपात (879) भारत के सभी राज्यों में सबसे कम था।" },
            { q: "213. राष्ट्रीय जनगणना 2011 के अनुसार भारत की कुल जनसंख्या में अनुसूचित जाति (SC) की आबादी कितनी है?", opts: ["16.6%", "8.6%", "21.2%", "10.4%"], ans: "16.6%", exp: "भारत की कुल जनसंख्या का 16.6% हिस्सा अनुसूचित जाति (SC) का है। पंजाब में SC का प्रतिशत सबसे अधिक है।" },
            { q: "214. राष्ट्रीय जनगणना 2011 के अनुसार किस राज्य में सर्वाधिक (संख्या में) अनुसूचित जाति (SC) निवास करती हैं?", opts: ["मिजोरम", "उत्तर प्रदेश", "पंजाब", "पश्चिम बंगाल"], ans: "उत्तर प्रदेश", exp: "कुल जनसंख्या (संख्या) के हिसाब से सबसे अधिक SC आबादी उत्तर प्रदेश में रहती है, जबकि प्रतिशत में पंजाब शीर्ष पर है।" },
            { q: "215. राष्ट्रीय जनगणना 2011 के अनुसार भारत की कुल आबादी का कितना प्रतिशत अनुसूचित जनजाति (ST) हैं?", opts: ["8.6%", "16.6%", "12.4%", "15.0%"], ans: "8.6%", exp: "भारत की कुल आबादी का 8.6% हिस्सा अनुसूचित जनजाति (ST) समुदाय से संबंधित है।" },
            { q: "216. 2011 की जनगणना के अनुसार सर्वाधिक अनुसूचित जनजाति (ST) प्रतिशत में किस राज्य/UT में है?", opts: ["मध्य प्रदेश", "मिजोरम / लक्षद्वीप", "झारखंड", "छत्तीसगढ़"], ans: "मिजोरम / लक्षद्वीप", exp: "प्रतिशत के आधार पर लक्षद्वीप (94.8%) और राज्यों में मिजोरम (94.4%) में ST की आबादी सर्वाधिक है।" },
            { q: "217. 2011 की जनगणना रिपोर्ट के अनुसार सर्वाधिक लोग किस धर्म को मानते हैं?", opts: ["मुस्लिम", "हिन्दू", "बौद्ध", "ईसाई"], ans: "हिन्दू", exp: "जनगणना 2011 के धर्म आधारित आंकड़ों के अनुसार भारत में हिंदू आबादी लगभग 79.8% है।" },
            { q: "218. राष्ट्रीय जनगणना 2011 की जनगणना का आदर्श वाक्य (Motto) क्या था?", opts: ["जनगणना एक भविष्य", "हमारी जनगणना हमारा भविष्य", "जनसंख्या और विकास", "सतत विकास और जनगणना"], ans: "हमारी जनगणना हमारा भविष्य", exp: "2011 की 15वीं राष्ट्रीय जनगणना का आधिकारिक आदर्श वाक्य था 'Our Census, Our Future' (हमारी जनगणना हमारा भविष्य)।" },
            { q: "219. राष्ट्रीय जनगणना 2011 के समय मुख्य जनगणना आयुक्त (Census Commissioner) कौन थे?", opts: ["डी. सी. चंद्रमौली", "शैलेश", "एम. डब्ल्यू. एम. यीट्स", "राजामौली"], ans: "डी. सी. चंद्रमौली", exp: "डॉ. सी. चंद्रमौली 2011 की जनगणना के दौरान भारत के महारजिस्ट्रार एवं जनगणना आयुक्त थे।" },
            { q: "220. भारत में जनगणना कराने का दायित्व किस मंत्रालय पर रहता हैं?", opts: ["सांख्यिकी मंत्रालय", "गृह मंत्रालय", "परिवार कल्याण मंत्रालय", "मानव संसाधन विकास मंत्रालय"], ans: "गृह मंत्रालय", exp: "भारत में जनगणना का कार्य भारत सरकार के गृह मंत्रालय (Ministry of Home Affairs) के अधीन 'रजिस्ट्रार जनरल एवं जनगणना आयुक्त' द्वारा किया जाता है।" },
            { q: "221. महानगर की संज्ञा उसे दी जाती है, जिसकी आबादी कितनी होती हैं?", opts: ["1 लाख या उससे अधिक", "5 लाख या उससे अधिक", "10 लाख या उससे अधिक", "50 लाख से अधिक"], ans: "10 लाख या उससे अधिक", exp: "1 मिलियन (10 लाख) या उससे अधिक आबादी वाले शहरों को महानगर (Metropolitan City) का दर्जा दिया जाता है।" },
            { q: "222. भारतीय संविधान के किस अनुच्छेद में अनुसूचित जनजाति (ST) की चर्चा की गई हैं?", opts: ["अनुच्छेद 341", "अनुच्छेद 342", "अनुच्छेद 338", "अनुच्छेद 339"], ans: "अनुच्छेद 342", exp: "संविधान के अनुच्छेद 342 के तहत राष्ट्रपति को किसी भी राज्य या केंद्र शासित प्रदेश में अनुसूचित जनजातियों को निर्दिष्ट करने की शक्ति प्राप्त है।" },
            { q: "223. मानवविज्ञानी बी.एस. गुहा ने भारतीय प्रजातियों को कितने वर्गों में विभाजित किया?", opts: ["4", "5", "6", "8"], ans: "6", exp: "बी.एस. गुहा (1935) ने भारतीय प्रजातियों को 6 मुख्य समूहों (नीग्रिटो, प्रोटो-ऑस्ट्रेलॉयड, मंगोलॉयड आदि) में वर्गीकृत किया था।" },
            { q: "224. सर्वप्रथम किसने जनजातियों के लिए 'आदिवासी' शब्द का प्रयोग किया?", opts: ["महात्मा गांधी", "ठक्कर बापा", "डॉ. बी.आर. अंबेडकर", "ज्योतिबा फुले"], ans: "ठक्कर बापा", exp: "अमृतलाल विट्ठलदास ठक्कर (ठक्कर बापा) ने भारत की जनजातियों के लिए सबसे पहले 'आदिवासी' शब्द का प्रयोग किया था।" },
            { q: "225. भारत में निवास करने वाली सबसे बड़ी जनजाति समूह कौन सा हैं?", opts: ["गोंड", "संथाल", "भील", "मुंडा"], ans: "भील", exp: "2011 की जनगणना के अनुसार भील भारत का सबसे बड़ा जनजातीय समूह है (लगभग 38%), इसके बाद गोंड और संथाल का स्थान आता है।" },
            { q: "226. कौन-सी आदिवासी समुदाय दीपावली को 'शोक के पर्व' के रूप में मनाती हैं?", opts: ["मुंडा", "संथाल", "थारू", "भोटिया"], ans: "थारू", exp: "थारू जनजाति (उत्तराखंड, यूपी और बिहार का तराई क्षेत्र) दीपावली को अपने पूर्वजों के शोक दिवस के रूप में मनाती है।" },
            { q: "227. भारतीय क्षेत्र की सबसे बड़ी जनजातीय समुदाय 'भील' का संबंध किस प्रजाति से हैं?", opts: ["नीग्रो", "प्रोटो-ऑस्ट्रेलॉयड", "नॉर्डिक", "अल्पाइन"], ans: "प्रोटो-ऑस्ट्रेलॉयड", exp: "भील, मुंडा, संथाल आदि अधिकांश मध्य और दक्षिण भारतीय जनजातियों का संबंध प्रोटो-ऑस्ट्रेलॉयड (Proto-Australoid) प्रजाति से है।" },
            { q: "228. भूत-प्रेत तथा जादू-टोना में सर्वाधिक विश्वास किस जनजाति का रहता हैं?", opts: ["संथाल", "भील", "थारू", "गद्दी"], ans: "संथाल", exp: "संथाल जनजाति (झारखंड, बंगाल) में अपने पारंपरिक अनुष्ठानों, जादू-टोने और आत्माओं पर अत्यधिक विश्वास देखा जाता है।" },
            { q: "229. निम्नलिखित में से किस जनजाति का संबंध 'राजपूत घरानों' से होने का दावा किया जाता हैं?", opts: ["नागा", "मीणा", "बुक्सा", "टोडा"], ans: "मीणा", exp: "राजस्थान की 'मीणा' जनजाति स्वयं को मत्स्य अवतार और प्राचीन राजपूत घरानों का वंशज मानती है।" },
            { q: "230. निम्नलिखित में से कौन जनजाति बिहार से संबंधित है?", opts: ["संथाल", "उरांव", "थारू", "उपरोक्त सभी"], ans: "उपरोक्त सभी", exp: "बिहार के विभिन्न जिलों (विशेषकर सीमावर्ती क्षेत्रों) में थारू (चंपारण), उरांव, संथाल, खरवार आदि जनजातियाँ निवास करती हैं।" },
            { q: "231. निम्नलिखित में से कौन-सी जनजाति का संबंध मेघालय से हैं?", opts: ["गारो", "खासी", "जयंतिया", "उपरोक्त सभी"], ans: "उपरोक्त सभी", exp: "मेघालय में गारो, खासी और जयंतिया प्रमुख जनजातियाँ हैं और इन्हीं के नाम पर वहाँ की पहाड़ियों का नाम भी रखा गया है।" },
            { q: "232. भारत के अत्याधिक भूकंप से जोखिम (तीव्रता 9 या अधिक - Zone V) वाले क्षेत्र में कौन-कौन से राज्य आते हैं?", opts: ["उत्तरी-पूर्वी राज्य", "हिमाचल प्रदेश", "कच्छ का रण (गुजरात)", "उपरोक्त सभी"], ans: "उपरोक्त सभी", exp: "ज़ोन V (अत्यधिक जोखिम) में पूरा पूर्वोत्तर भारत, जम्मू-कश्मीर, हिमाचल, उत्तराखंड के कुछ हिस्से, कच्छ का रण और उत्तरी बिहार शामिल हैं।" },
            { q: "233. उष्ण कटिबंधीय चक्रवात एक उग्र मौसम तंत्र है जो किन अक्षांशों के बीच आता हैं?", opts: ["5° से 30° उत्तर-दक्षिण", "35° से 60° उत्तर-दक्षिण", "0° से 5° उत्तर-दक्षिण", "60° से 90° उत्तर-दक्षिण"], ans: "5° से 30° उत्तर-दक्षिण", exp: "उष्णकटिबंधीय चक्रवात मुख्य रूप से भूमध्य रेखा के दोनों ओर 5° से 30° अक्षांशों के बीच गर्म महासागरों के ऊपर उत्पन्न होते हैं।" },
            { q: "234. राष्ट्रीय बाढ़ आयोग ने भारत के कितने भूमि को बाढ़ प्रभावित क्षेत्र घोषित किया है?", opts: ["2 करोड़ हेक्टेयर", "4 करोड़ हेक्टेयर", "10 करोड़ हेक्टेयर", "14 करोड़ हेक्टेयर"], ans: "4 करोड़ हेक्टेयर", exp: "राष्ट्रीय बाढ़ आयोग (RBA) के आकलन के अनुसार भारत का लगभग 40 मिलियन (4 करोड़) हेक्टेयर क्षेत्र बाढ़ प्रवण है।" },
            { q: "235. भोपाल गैस त्रासदी में कौन-सा जहरीला गैस का उत्सर्जन हुआ था?", opts: ["कार्बन मोनोऑक्साइड", "मिथाइल आइसोसायनेट", "CFC", "मिथेन"], ans: "मिथाइल आइसोसायनेट", exp: "1984 में भोपाल स्थित यूनियन कार्बाइड कारखाने से मिथाइल आइसोसायनेट (MIC) नामक जहरीली गैस के रिसाव से हजारों मौतें हुई थीं।" },

            { q: "240. भारत में 'राष्ट्रीय बाढ़ नियंत्रण कार्यक्रम' की शुरूआत कब किया गया?", opts: ["1953", "1954", "1962", "1967"], ans: "1954", exp: "बाढ़ के विनाशकारी प्रभावों को कम करने के लिए भारत सरकार ने 1954 में राष्ट्रीय बाढ़ नियंत्रण कार्यक्रम (NFCP) शुरू किया था।" },
            { q: "241. 'मरुभूमि विकास कार्यक्रम' (DDP) कब से चलाया जा रहा हैं?", opts: ["1967-68", "1973-74", "1977-78", "1981-82"], ans: "1977-78", exp: "रेगिस्तान के विस्तार को रोकने और सूखे के प्रभाव को कम करने के लिए 1977-78 में यह कार्यक्रम शुरू किया गया था।" },
            { q: "242. बिहार राज्य का गठन कब हुआ था?", opts: ["22 मार्च, 1912", "22 मार्च, 1936", "1 अप्रैल, 1936", "15 नवंबर, 2000"], ans: "22 मार्च, 1936", exp: "बंगाल से अलग होकर 22 मार्च 1912 को बिहार बना। हालांकि आधुनिक स्वरूप में ओडिशा से अलग होकर बिहार प्रांत 1936 में पुनर्गठित हुआ।" },
            { q: "243. मैकमोहन रेखा चीन के तिब्बत स्वायत्त क्षेत्र और भारत के किस राज्य के बीच स्थित हैं?", opts: ["सिक्किम", "अरुणाचल प्रदेश", "उत्तराखंड", "लद्दाख"], ans: "अरुणाचल प्रदेश", exp: "1914 के शिमला समझौते में सर हेनरी मैकमोहन द्वारा निर्धारित यह रेखा भारत के अरुणाचल प्रदेश और तिब्बत के बीच स्थित है।" },
            { q: "244. नागालैंड की अंतर्राष्ट्रीय सीमा किस राष्ट्र से लगती हैं?", opts: ["चीन", "नेपाल", "म्यांमार", "बांग्लादेश"], ans: "म्यांमार", exp: "भारत के चार उत्तर-पूर्वी राज्यों (अरुणाचल प्रदेश, नागालैंड, मणिपुर और मिजोरम) की सीमा म्यांमार के साथ लगती है।" },
            { q: "245. सिक्किम को भारतीय क्षेत्र में पूर्ण राज्य के रूप में कब शामिल किया गया?", opts: ["1950", "1975", "1987", "1992"], ans: "1975", exp: "36वें संविधान संशोधन 1975 के माध्यम से सिक्किम को भारत गणराज्य का 22वां पूर्ण राज्य बनाया गया।" },
            { q: "246. उत्तर प्रदेश में लोकसभा की कुल कितनी सीटें हैं?", opts: ["40", "42", "48", "80"], ans: "80", exp: "उत्तर प्रदेश भारत में सर्वाधिक आबादी वाला राज्य है और यहाँ लोकसभा की सर्वाधिक 80 सीटें हैं।" },
            { q: "247. मिजोरम का कितना लंबा सीमास्थल बांग्लादेश से लगा हुआ हैं?", opts: ["318 km", "510 km", "722 km", "823 km"], ans: "318 km", exp: "मिजोरम की अंतर्राष्ट्रीय सीमा बांग्लादेश (लगभग 318 किमी) और म्यांमार (510 किमी) दोनों के साथ लगती है।" },
            { q: "248. तमिलनाडु की सीमा किन राज्यों से लगती हैं?", opts: ["केरल, कर्नाटक, महाराष्ट्र", "केरल, कर्नाटक, आंध्र प्रदेश", "कर्नाटक, केरल, ओडिशा", "गोवा, कर्नाटक, आंध्र प्रदेश"], ans: "केरल, कर्नाटक, आंध्र प्रदेश", exp: "भारत के दक्षिणी सिरे पर स्थित तमिलनाडु की जमीनी सीमा पश्चिम में केरल, उत्तर-पश्चिम में कर्नाटक और उत्तर में आंध्र प्रदेश से लगती है।" },
            { q: "249. महाराष्ट्र का कुल क्षेत्रफल लगभग कितना हैं?", opts: ["3,07,713 वर्ग किमी", "2,43,286 वर्ग किमी", "94,163 वर्ग किमी", "79,716 वर्ग किमी"], ans: "3,07,713 वर्ग किमी", exp: "क्षेत्रफल की दृष्टि से राजस्थान और मध्य प्रदेश के बाद महाराष्ट्र (3,07,713 sq km) भारत का तीसरा सबसे बड़ा राज्य है।" },
            { q: "250. तेलंगाना राज्य की स्थापना कब हुई?", opts: ["1 नवंबर, 2000", "2 जून, 2014", "16 मई, 1975", "30 मई, 1987"], ans: "2 जून, 2014", exp: "आंध्र प्रदेश पुनर्गठन अधिनियम 2014 के तहत 2 जून 2014 को तेलंगाना भारत का 29वां (वर्तमान में 28वां) राज्य बना।" },
            { q: "251. भारत का कौन-कौन क्षेत्र चीन के साथ विवादित स्थिति में हैं?", opts: ["गलवान घाटी", "अक्साई चीन", "तवांग", "उपरोक्त सभी"], ans: "उपरोक्त सभी", exp: "लद्दाख में अक्साई चीन और गलवान घाटी, तथा अरुणाचल प्रदेश में तवांग क्षेत्र पर चीन अपना दावा करता है, जो भारत के साथ विवादित है।" }
        ];

        // Shuffle Function
        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Render Quiz Function
        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            
            questionsData.forEach((questionObj, index) => {
                const card = document.createElement('div');
                card.className = "bg-white p-5 md:p-6 border border-slate-200 rounded-xl shadow-sm hover:shadow-md transition-shadow duration-300 relative";
                
                const qText = document.createElement('h2');
                qText.className = "text-lg md:text-xl font-bold text-slate-800 mb-4 leading-relaxed";
                qText.textContent = questionObj.q;
                card.appendChild(qText);

                const grid = document.createElement('div');
                grid.className = "grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4";
                
                const shuffledOpts = shuffleArray(questionObj.opts);

                shuffledOpts.forEach(optText => {
                    const btn = document.createElement('button');
                    btn.className = "option-btn w-full text-left px-5 py-3 rounded-lg border-2 border-slate-200 bg-white text-slate-700 font-medium hover:border-indigo-400 hover:bg-indigo-50 focus:outline-none";
                    btn.textContent = optText;
                    
                    btn.onclick = function() {
                        const allBtns = grid.querySelectorAll('.option-btn');
                        
                        allBtns.forEach(b => {
                            b.disabled = true;
                            b.classList.remove('hover:border-indigo-400', 'hover:bg-indigo-50');
                            
                            // Highlight the correct answer universally
                            if(b.textContent === questionObj.ans) {
                                b.classList.add('correct-ans');
                            }
                        });

                        // Flag wrong answer
                        if(optText !== questionObj.ans) {
                            btn.classList.add('wrong-ans');
                        }

                        // Show Explanation
                        expDiv.style.display = 'block';
                    };
                    
                    grid.appendChild(btn);
                });

                card.appendChild(grid);

                // Explanation Section
                const expDiv = document.createElement('div');
                expDiv.className = "explanation mt-5 p-4 bg-emerald-50 border-l-4 border-emerald-500 rounded-r-lg text-emerald-900 text-sm md:text-base";
                expDiv.innerHTML = `<span class="font-bold text-emerald-700 block mb-1">व्याख्या:</span> ${questionObj.exp}`;
                
                card.appendChild(expDiv);
                container.appendChild(card);
            });
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', renderQuiz);
    </script>
